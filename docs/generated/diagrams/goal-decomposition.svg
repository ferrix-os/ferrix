<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 470.8 624" width="470.8" height="624" role="img" aria-label="Traceability diagram: Hosts rustc. 15 nodes, 16 edges. Most connected: G  Hosts rustc (8), G.2  Address space scale (2), G.7  Durable filesystem (2)."><title>Hosts rustc</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="470.8" height="624" fill="var(--surface)"/><defs><marker id="dg-goal-decomposition-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-goal-decomposition-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-goal-decomposition-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-goal-decomposition-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge" d="M176.4,297 L280,52" marker-start="url(#dg-goal-decomposition-diamond)"/><path class="dg-edge" d="M176.4,297 L262,122" marker-start="url(#dg-goal-decomposition-diamond)"/><path class="dg-edge" d="M176.4,297 L276.4,192" marker-start="url(#dg-goal-decomposition-diamond)"/><path class="dg-edge" d="M176.4,297 L283.6,262" marker-start="url(#dg-goal-decomposition-diamond)"/><path class="dg-edge" d="M176.4,297 L276.4,332" marker-start="url(#dg-goal-decomposition-diamond)"/><path class="dg-edge" d="M176.4,297 L308.8,402" marker-start="url(#dg-goal-decomposition-diamond)"/><path class="dg-edge" d="M176.4,297 L265.6,472" marker-start="url(#dg-goal-decomposition-diamond)"/><path class="dg-edge" d="M176.4,297 L276.4,542" marker-start="url(#dg-goal-decomposition-diamond)"/><path class="dg-edge dg-edge-trace" d="M201.6,45 L280,52" marker-end="url(#dg-goal-decomposition-open)"/><path class="dg-edge dg-edge-trace" d="M201.6,129 L262,122" marker-end="url(#dg-goal-decomposition-open)"/><path class="dg-edge dg-edge-trace" d="M201.6,220 L276.4,192" marker-end="url(#dg-goal-decomposition-open)"/><path class="dg-edge dg-edge-trace" d="M201.6,220 L283.6,262" marker-end="url(#dg-goal-decomposition-open)"/><path class="dg-edge dg-edge-trace" d="M180,374 L276.4,332" marker-end="url(#dg-goal-decomposition-open)"/><path class="dg-edge dg-edge-trace" d="M180,374 L308.8,402" marker-end="url(#dg-goal-decomposition-open)"/><path class="dg-edge dg-edge-trace" d="M216,465 L265.6,472" marker-end="url(#dg-goal-decomposition-open)"/><path class="dg-edge dg-edge-trace" d="M208.8,549 L276.4,542" marker-end="url(#dg-goal-decomposition-open)"/><g><rect class="dg-shape dg-mat-implemented" x="28.4" y="14" width="173.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="115" y="33" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="115" y="49" text-anchor="middle" font-size="12">S5  Stage 5 scheduler</text><text class="dg-text dg-sub" x="115" y="63" text-anchor="middle" font-size="10.5">Done</text><title>Task, kernel stacks, context switch, per-CPU runqueues, the class stack, EEVDF in src/lib/kernel/sched-fair.</title></g><g><rect class="dg-shape dg-mat-implemented" x="28.4" y="98" width="173.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="115" y="117" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="115" y="133" text-anchor="middle" font-size="12">S6  Stage 6 user mode</text><text class="dg-text dg-sub" x="115" y="147" text-anchor="middle" font-size="10.5">Done</text><title>AddressSpace, VMOs, the VMA tree as a process map, demand paging, copy-on-write, the ELF loader, the ring-3/EL0/USR transition.</title></g><g><rect class="dg-shape dg-mat-implemented" x="28.4" y="189" width="173.2" height="62" rx="4"/><text class="dg-text dg-stereo" x="115" y="208" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="115" y="224" text-anchor="middle" font-size="12">S7  Stage 7 Linux ABI</text><text class="dg-text dg-sub" x="115" y="238" text-anchor="middle" font-size="10.5">Done</text><title>Syscall entry on every architecture, the dispatch table, the core surface: memory, files, process, threads and futex, signals with sigaltstack and rt_sigreturn, time, identity.</title></g><g><rect class="dg-shape" x="53.6" y="273" width="122.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="115" y="292" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="115" y="308" text-anchor="middle" font-size="12">G  Hosts rustc</text><title>The acceptance test: a statically linked musl `rustc` compiles `hello.rs` on Ferrix, the binary it produced runs, and CI proves both.</title></g><g><rect class="dg-shape dg-mat-implemented" x="50" y="343" width="130" height="62" rx="4"/><text class="dg-text dg-stereo" x="115" y="362" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="115" y="378" text-anchor="middle" font-size="12">S8  Stage 8 VFS</text><text class="dg-text dg-sub" x="115" y="392" text-anchor="middle" font-size="10.5">Done</text><title>Inode and dentry caches, the mount table, fd sharing rules, tmpfs, devfs, procfs, cpio initramfs.</title></g><g><rect class="dg-shape dg-mat-implemented" x="14" y="434" width="202" height="62" rx="4"/><text class="dg-text dg-stereo" x="115" y="453" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="115" y="469" text-anchor="middle" font-size="12">S12  Stage 12 btrfs write</text><text class="dg-text dg-sub" x="115" y="483" text-anchor="middle" font-size="10.5">Done</text><title>btrfs stage B.</title></g><g><rect class="dg-shape dg-mat-implemented" x="21.2" y="518" width="187.6" height="62" rx="4"/><text class="dg-text dg-stereo" x="115" y="537" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="115" y="553" text-anchor="middle" font-size="12">S13  Stage 13 isolation</text><text class="dg-text dg-sub" x="115" y="567" text-anchor="middle" font-size="10.5">Done</text><title>Seven namespaces (mount, user, UTS, IPC, cgroup, pid, network), the unified cgroup hierarchy with cpu, memory, io and pids as built, cgroupfs, classic-BPF seccomp with the interpreter in src/lib/, and Syscall User Dispatch.</title></g><g><rect class="dg-shape" x="280" y="28" width="158.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="359.4" y="47" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="359.4" y="63" text-anchor="middle" font-size="12">G.1  Kernel threads</text><title>rustc needs clone(CLONE_THREAD|CLONE_VM|CLONE_SETTLS), the futex family, set_tid_address and robust lists.</title></g><g><rect class="dg-shape" x="262" y="98" width="194.8" height="48" rx="4"/><text class="dg-text dg-stereo" x="359.4" y="117" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="359.4" y="133" text-anchor="middle" font-size="12">G.2  Address space scale</text><title>mmap/mprotect/munmap with MAP_FIXED and MAP_NORESERVE over 2 to 8 GiB of address space.</title></g><g><rect class="dg-shape" x="276.4" y="168" width="166" height="48" rx="4"/><text class="dg-text dg-stereo" x="359.4" y="187" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="359.4" y="203" text-anchor="middle" font-size="12">G.3  Signal delivery</text><title>A SIGSEGV handler on an alternate stack.</title></g><g><rect class="dg-shape" x="283.6" y="238" width="151.6" height="48" rx="4"/><text class="dg-text dg-stereo" x="359.4" y="257" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="359.4" y="273" text-anchor="middle" font-size="12">G.4  Process spawn</text><title>fork/execve/wait4 to run the linker.</title></g><g><rect class="dg-shape" x="276.4" y="308" width="166" height="48" rx="4"/><text class="dg-text dg-stereo" x="359.4" y="327" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="359.4" y="343" text-anchor="middle" font-size="12">G.5  Syscall surface</text><title>openat, getdents64, statx, renameat2, pread64, about 150 syscalls in total.</title></g><g><rect class="dg-shape" x="308.8" y="378" width="101.2" height="48" rx="4"/><text class="dg-text dg-stereo" x="359.4" y="397" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="359.4" y="413" text-anchor="middle" font-size="12">G.6  Procfs</text><title>/proc/self/maps, /proc/self/exe, /proc/self/fd.</title></g><g><rect class="dg-shape" x="265.6" y="448" width="187.6" height="48" rx="4"/><text class="dg-text dg-stereo" x="359.4" y="467" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="359.4" y="483" text-anchor="middle" font-size="12">G.7  Durable filesystem</text><title>A writable filesystem with room for a ~2 GiB sysroot.</title></g><g><rect class="dg-shape" x="276.4" y="518" width="166" height="48" rx="4"/><text class="dg-text dg-stereo" x="359.4" y="537" text-anchor="middle" font-size="9.5">«requirement»</text><text class="dg-text" x="359.4" y="553" text-anchor="middle" font-size="12">G.8  Memory pressure</text><title>rustc will exhaust memory on a small machine, so reclaim is a correctness requirement: an OOM kill scoped by Job and cgroup, never a livelock.</title></g><rect class="dg-shape dg-mat-implemented" x="14" y="602" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="611.5" font-size="10">implemented</text></svg>