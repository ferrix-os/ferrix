</g><g><rect class="dg-shape dg-mat-implemented" x="102.1" y="171" width="66.1" height="48" rx="4"/><text class="dg-text" x="135.1" y="192" text-anchor="middle" font-size="12">Devfs</text><text class="dg-text dg-sub" x="135.1" y="206" text-anchor="middle" font-size="10.5">stage 8</text><title>src/kernel/src/fs/devfs.rs: null, zero, full, random, urandom, tty and console, numbered as Linux numbers them, ptmx and the dri, input and pts directories since stages 17 and 18, and the disks a driver&#x27;s kernel side registers.</title></g><g><rect class="dg-shape dg-mat-implemented" x="190.2" y="171" width="66.1" height="48" rx="4"/><text class="dg-text" x="223.2" y="192" text-anchor="middle" font-size="12">Procfs</text><text class="dg-text dg-sub" x="223.2" y="206" text-anchor="middle" font-size="10.5">stage 8</text><title>self/maps, self/exe, self/fd backed by the real VM and fd table; cpuinfo, meminfo.</title></g><g><rect class="dg-shape dg-mat-implemented" x="278.3" y="178" width="58" height="34" rx="4"/><text class="dg-text" x="307.3" y="199" text-anchor="middle" font-size="12">Sysfs</text><title>src/kernel/src/fs/sysfs.rs over src/lib/fs/common/sysfs&#x27;s text, a view that stores nothing, fed by the services that own each fact (docs/SYSFS.md): enumeration&#x27;s device nodes under devices/pci and platform, the disks, interfaces, cards, render nodes and input devices the ring-3 drivers published, each inside the node its driver serves, and devmgr&#x27;s word on which driver drives which device.</title></g><g><rect class="dg-shape dg-mat-implemented" x="358.3" y="171" width="79.6" height="48" rx="4"/><text class="dg-text" x="398.1" y="192" text-anchor="middle" font-size="12">Cgroupfs</text><text class="dg-text dg-sub" x="398.1" y="206" text-anchor="middle" font-size="10.5">stage 13</text><title>src/lib/fs/common/cgroupfs, mounted as cgroup2 since 2026-09-23: a view of the job tree that stores nothing, with cgroup.events, delegation by chown, and the pids, memory and cpu files over each job&#x27;s quota slot (docs/C…</title></g><g><rect class="dg-shape dg-mat-implemented" x="459.9" y="171" width="72.4" height="48" rx="4"/><text class="dg-text" x="496.1" y="192" text-anchor="middle" font-size="12">Btrfs</text><text class="dg-text dg-sub" x="496.1" y="206" text-anchor="middle" font-size="10.5">stage 11</text><title>The real filesystem, read and write, single device, no RAID 5/6.</title></g><g><rect class="dg-shape dg-mat-implemented" x="215.9" y="14" width="103.9" height="111" rx="4"/><text class="dg-text dg-stereo" x="267.8" y="33" text-anchor="middle" font-size="9.5">«def»</text><text class="dg-text" x="267.8" y="49" text-anchor="middle" font-size="12">Filesystem</text><line class="dg-rule" x1="215.9" y1="58" x2="319.8" y2="58"/><text class="dg-text dg-row" x="226.9" y="68.5" font-size="10.5">action mount</text><text class="dg-text dg-row" x="226.9" y="83" font-size="10.5">action lookup</text><text class="dg-text dg-row" x="226.9" y="97.5" font-size="10.5">action read</text><text class="dg-text dg-row" x="226.9" y="112" font-size="10.5">action write</text><title>src/lib/fs/common/vfs&#x27;s FileSystem trait.</title></g><rect class="dg-shape dg-mat-implemented" x="14" y="241" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="250.5" font-size="10">implemented</text></svg>