<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1041.2 306" width="1041.2" height="306" role="img" aria-label="Block diagram: Driver process and its subtypes. 8 nodes, 7 edges. Most connected: DriverProcess (7), Gc400Driver (1), Stm32SdmmcDriver (1)."><title>Driver process and its subtypes</title><style>
svg{
  --surface:#fff; --surface-2:#f6f7f8; --sunk:#e4e7ea;
  --ink:#16191d; --ink-2:#3b434c; --muted:#6a737e;
  --rule:#d2d7dc; --rule-strong:#b3bbc3;
  --implemented:#2c6e4e; --implemented-bg:#dceae2;
  --inProgress:#2a5f8f; --inProgress-bg:#dae5f0;
  --writtenAhead:#6b4fa0; --writtenAhead-bg:#e5dff0;
  --planned:#6a737e; --planned-bg:#e4e7ea;
  --deferred:#87600b; --deferred-bg:#f3e8ce;
}
@media (prefers-color-scheme:dark){svg{
  --surface:#1a1e22; --surface-2:#21262b; --sunk:#0e1113;
  --ink:#e7eaed; --ink-2:#bfc6cd; --muted:#8d97a1;
  --rule:#2c3238; --rule-strong:#5a646e;
  --implemented:#6abf92; --implemented-bg:#16301f;
  --inProgress:#74acdb; --inProgress-bg:#122639;
  --writtenAhead:#a98fd8; --writtenAhead-bg:#241c38;
  --planned:#8d97a1; --planned-bg:#262b31;
  --deferred:#d9a83e; --deferred-bg:#2e2511;
}}

figure.diagram{margin:22px 0 26px; padding:0}
figure.diagram svg{display:block; max-width:100%; height:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:3px}
figure.diagram figcaption{margin-top:9px; font-size:13px; color:var(--muted); max-width:74ch}
figure.diagram figcaption .figname{color:var(--ink-2); font-weight:600}
.dg-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:var(--ink)}
.dg-sub{fill:var(--muted)}
.dg-stereo{fill:var(--muted); letter-spacing:.02em}
.dg-row{fill:var(--ink-2)}
.dg-shape{fill:var(--surface-2); stroke:var(--rule-strong); stroke-width:1.1}
.dg-terminal{fill:var(--sunk); stroke:var(--rule-strong)}
.dg-note{fill:var(--surface-2); stroke:var(--rule); stroke-dasharray:3 2}
.dg-rule{stroke:var(--rule-strong); stroke-width:1}
.dg-cluster{fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:4 3}
.dg-cluster-label{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge{fill:none; stroke:var(--rule-strong); stroke-width:1.4}
.dg-edge-trace{stroke-dasharray:5 4}
.dg-edge-label{fill:var(--ink-2); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-edge-label-bg{fill:var(--surface); stroke:none}
.dg-head{fill:var(--rule-strong); stroke:none}
.dg-head-hollow{fill:var(--surface); stroke:var(--rule-strong); stroke-width:1.1}
.dg-legend{fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dg-mat-implemented{fill:var(--implemented-bg); stroke:var(--implemented)}
.dg-mat-inProgress{fill:var(--inProgress-bg); stroke:var(--inProgress)}
.dg-mat-writtenAhead{fill:var(--writtenAhead-bg); stroke:var(--writtenAhead)}
.dg-mat-planned{fill:var(--planned-bg); stroke:var(--planned)}
.dg-mat-deferred{fill:var(--deferred-bg); stroke:var(--deferred)}
a.dg-link{text-decoration:none}
</style><rect width="1041.2" height="306" fill="var(--surface)"/><defs><marker id="dg-ferrix-drivers-driver-process-arrow" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0,0 L9,3.5 L0,7 L1.6,3.5 z"/></marker><marker id="dg-ferrix-drivers-driver-process-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-edge" d="M0.5,0.5 L9,4 L0.5,7.5"/></marker><marker id="dg-ferrix-drivers-driver-process-hollow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head-hollow" d="M0.5,0.5 L11,5 L0.5,9.5 z"/></marker><marker id="dg-ferrix-drivers-driver-process-diamond" markerWidth="14" markerHeight="9" refX="0.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-head" d="M0.5,4.5 L7,0.5 L13.5,4.5 L7,8.5 z"/></marker></defs><path class="dg-edge" d="M79,214 L528.8,168" marker-end="url(#dg-ferrix-drivers-driver-process-hollow)"/><path class="dg-edge" d="M231,221 L528.8,168" marker-end="url(#dg-ferrix-drivers-driver-process-hollow)"/><path class="dg-edge" d="M383,214 L528.8,168" marker-end="url(#dg-ferrix-drivers-driver-process-hollow)"/><path class="dg-edge" d="M542.2,214 L528.8,168" marker-end="url(#dg-ferrix-drivers-driver-process-hollow)"/><path class="dg-edge" d="M690.6,214 L528.8,168" marker-end="url(#dg-ferrix-drivers-driver-process-hollow)"/><path class="dg-edge" d="M817.4,214 L528.8,168" marker-end="url(#dg-ferrix-drivers-driver-process-hollow)"/><path class="dg-edge" d="M958.6,214 L528.8,168" marker-end="url(#dg-ferrix-drivers-driver-process-hollow)"/><g><rect class="dg-shape dg-mat-implemented" x="14" y="214" width="130" height="48" rx="4"/><text class="dg-text" x="79" y="235" text-anchor="middle" font-size="12">VirtioBlkDriver</text><text class="dg-text dg-sub" x="79" y="249" text-anchor="middle" font-size="10.5">stage 10</text><title>The first driver: virtio-blk as a user process.</title></g><g><rect class="dg-shape dg-mat-implemented" x="166" y="221" width="130" height="34" rx="4"/><text class="dg-text" x="231" y="242" text-anchor="middle" font-size="12">VirtioNetDriver</text><title>src/user/system/native/drivers/net/virtio-net over src/lib/drivers/net/virtio-net and src/lib/drivers/net/netserve, speaking the net ring; cargo xtask test-net is its gate.</title></g><g><rect class="dg-shape dg-mat-implemented" x="318" y="214" width="130" height="48" rx="4"/><text class="dg-text" x="383" y="235" text-anchor="middle" font-size="12">VirtioGpuDriver</text><text class="dg-text dg-sub" x="383" y="249" text-anchor="middle" font-size="10.5">stage 17</text><title>src/user/system/native/drivers/display/virtio-gpu over src/lib/drivers/display/virtio-gpu: the display core&#x27;s card0 over displayctl, and since stage 19 the render core&#x27;s renderD128 over renderctl, turning its messages into virtio-gpu&#x27;s 3D commands.</title></g><g><rect class="dg-shape dg-mat-implemented" x="470" y="214" width="144.4" height="48" rx="4"/><text class="dg-text" x="542.2" y="235" text-anchor="middle" font-size="12">VirtioInputDriver</text><text class="dg-text dg-sub" x="542.2" y="249" text-anchor="middle" font-size="10.5">stage 17</text><title>src/user/system/native/drivers/input/virtio-input over src/lib/drivers/input/virtio-input, feeding the input core&#x27;s /dev/input/eventN over inputctl; cargo xtask test-input is its gate.</title></g><g><rect class="dg-shape dg-mat-implemented" x="636.4" y="214" width="108.4" height="48" rx="4"/><text class="dg-text" x="690.6" y="235" text-anchor="middle" font-size="12">UsbHidDriver</text><text class="dg-text dg-sub" x="690.6" y="249" text-anchor="middle" font-size="10.5">stage 17</text><title>src/user/system/native/drivers/usb/usbhid over src/lib/drivers/usb/usb-host: the STM32MP157&#x27;s EHCI controller, its hubs, and HID keyboards, mice and media keys read by their report descriptors, each served to the input core over a control channel of its own, keyboards&#x27; LEDs lit by the core&#x27;s STATUS.</title></g><g><rect class="dg-shape dg-mat-inProgress" x="766.8" y="214" width="101.2" height="48" rx="4"/><text class="dg-text" x="817.4" y="235" text-anchor="middle" font-size="12">Gc400Driver</text><text class="dg-text dg-sub" x="817.4" y="249" text-anchor="middle" font-size="10.5">stage 19</text><title>src/user/system/native/drivers/gpu/gc400 over src/lib/drivers/gpu/gc400: the STM32MP157&#x27;s Vivante GC400T, the G2 step of the board&#x27;s gears (docs/GPU.md §6.3).</title></g><g><rect class="dg-shape dg-mat-inProgress" x="890" y="214" width="137.2" height="48" rx="4"/><text class="dg-text" x="958.6" y="235" text-anchor="middle" font-size="12">Stm32SdmmcDriver</text><text class="dg-text dg-sub" x="958.6" y="249" text-anchor="middle" font-size="10.5">stage 10</text><title>src/user/system/native/drivers/block/stm32-sdmmc over src/lib/drivers/block/stm32-sdmmc: the STM32MP157&#x27;s SDMMC1 as a disk behind the block ring, so the kernel&#x27;s GPT scan publishes the card&#x27;s partitions and btrfs mounts from one (docs/CHROME.md 10.1).</title></g><g><rect class="dg-shape dg-mat-implemented" x="470.6" y="14" width="116.5" height="154" rx="4"/><text class="dg-text dg-stereo" x="528.8" y="33" text-anchor="middle" font-size="9.5">«def»</text><text class="dg-text" x="528.8" y="49" text-anchor="middle" font-size="12">DriverProcess</text><text class="dg-text dg-sub" x="528.8" y="63" text-anchor="middle" font-size="10.5">stage 10</text><line class="dg-rule" x1="470.6" y1="72" x2="587.1" y2="72"/><text class="dg-text dg-row" x="481.6" y="82.5" font-size="10.5">part job</text><text class="dg-text dg-row" x="481.6" y="97" font-size="10.5">part ioMappings</text><text class="dg-text dg-row" x="481.6" y="111.5" font-size="10.5">part interrupts</text><text class="dg-text dg-row" x="481.6" y="126" font-size="10.5">part eventPort</text><text class="dg-text dg-row" x="481.6" y="140.5" font-size="10.5">part dmaBuffers</text><text class="dg-text dg-row" x="481.6" y="155" font-size="10.5">part channel</text><title>An ordinary user process in its own Job, holding exactly the capabilities devmgr gave it.</title></g><rect class="dg-shape dg-mat-implemented" x="14" y="284" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="30" y="293.5" font-size="10">implemented</text><rect class="dg-shape dg-mat-inProgress" x="112" y="284" width="11" height="11" rx="2"/><text class="dg-text dg-legend" x="128" y="293.5" font-size="10">in progress</text></svg>