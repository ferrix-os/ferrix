[package]
name = "ferrix-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so `cargo fuzz` can pick its own profile and its
# sanitizer-instrumented build does not disturb the main target directory.
# `tools/common/check/check-crate-layering.sh` knows to skip a manifest that declares one.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
ferrix-acpi = { path = "../../lib/platform/acpi" }
ferrix-cpio = { path = "../../lib/fs/common/cpio" }
ferrix-argon2 = { path = "../../lib/crypto/argon2" }
ferrix-auth-proto = { path = "../../lib/proto/auth-proto" }
ferrix-elf = { path = "../../lib/platform/elf" }
ferrix-fdt = { path = "../../lib/platform/fdt" }
ferrix-frame = { path = "../../lib/kernel/frame" }
ferrix-ustack = { path = "../../lib/kernel/ustack" }
ferrix-linux-abi = { path = "../../lib/proto/linux-abi" }
ferrix-native-abi = { path = "../../lib/proto/native-abi" }
ferrix-objects = { path = "../../lib/kernel/objects" }
ferrix-sync = { path = "../../lib/kernel/sync" }
ferrix-vfs = { path = "../../lib/fs/common/vfs" }
ferrix-pci = { path = "../../lib/platform/pci" }
ferrix-btrfs = { path = "../../lib/fs/btrfs/format" }
ferrix-block = { path = "../../lib/fs/common/block", features = ["model"] }
ferrix-blkring = { path = "../../lib/proto/blkring" }
ferrix-virtio = { path = "../../lib/drivers/virtio" }
ferrix-display-modes = { path = "../../lib/drivers/display/modes" }
ferrix-displayctl = { path = "../../lib/proto/displayctl" }
ferrix-renderctl = { path = "../../lib/proto/renderctl" }
ferrix-inputctl = { path = "../../lib/proto/inputctl" }
ferrix-sndctl = { path = "../../lib/proto/sndctl" }
ferrix-virtio-blk = { path = "../../lib/drivers/block/virtio-blk" }
ferrix-virtio-net = { path = "../../lib/drivers/net/virtio-net" }
ferrix-virtio-gpu = { path = "../../lib/drivers/display/virtio-gpu" }
ferrix-virtio-input = { path = "../../lib/drivers/input/virtio-input" }
ferrix-netwire = { path = "../../lib/network/netwire" }
ferrix-nettcp = { path = "../../lib/network/nettcp" }
ferrix-net = { path = "../../lib/network/net" }
ferrix-netlink = { path = "../../lib/network/netlink" }
ferrix-cgroupfs = { path = "../../lib/fs/common/cgroupfs" }
ferrix-seccomp = { path = "../../lib/kernel/seccomp" }
ferrix-sysfs = { path = "../../lib/fs/common/sysfs" }
ferrix-svc = { path = "../../lib/init/svc" }
ferrix-svc-proto = { path = "../../lib/init/svc-proto" }
compositor-config = { path = "../../user/system/linux/compositor/config" }
compositor-wire = { path = "../../user/system/linux/compositor/wire" }

