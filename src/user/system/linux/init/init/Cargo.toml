[package]
name = "init"
description = "/sbin/init: the event loop and the Linux backends around src/lib/init/svc's manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Declarations only, as in zinc: clone3, mount, epoll and signalfd are the C
# library std already links, or raw system calls through its `syscall`.
libc = "0.2.189"
# The manager: unit files, the graph, operations, every kind's state machine.
ferrix-svc = { path = "../../../../../lib/init/svc" }
# The control socket's records and the readiness lines.
ferrix-svc-proto = { path = "../../../../../lib/init/svc-proto" }
# The native calls, for bootstrap channels, native services and the
# directory (docs/INIT.md §6): the numbers and layouts, and the typed
# wrappers over them.
ferrix-native = { path = "../../../../../lib/proto/native" }
ferrix-native-abi = { path = "../../../../../lib/proto/native-abi" }
# The audit record's layout, for the reader (docs/certification/AUDIT.md §4).
ferrix-audit = { path = "../../../../../lib/proto/audit" }

# The computer's name, checked by the same rules settingsd writes it with
# (docs/SETTINGS-WRITER.md §4, B2; ledger 3636 (18)).
ferrix-settings-proto = { path = "../../settingsd/proto" }

[lints]
workspace = true
