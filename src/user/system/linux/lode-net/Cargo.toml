# lode-net: the log over the network (docs/LOGGING.md §10.2, §10.3).
#
# `lode-upload`, on a Ferrix machine, sends its log on to collectors;
# `lode-receive`, on a Linux host, takes it in and keeps a lode store for
# each machine that sends, which `lode-viewer` opens. Both read and write
# stores with the tree's own `ferrix-lode-core`.
#
# A workspace of its own, as dhcp's and init's are: a Linux user program
# built with std against the target's own musl. TLS is rustls with a
# provider of ours (src/provider.rs) on the RustCrypto crates -- pure Rust,
# so no C compiler for the musl Arm targets -- and TLS 1.3 with
# ChaCha20-Poly1305, X25519 and Ed25519 alone, since we make both ends.
[package]
name = "lode-net"
description = "lode's store-and-forward over TLS: lode-upload on Ferrix, lode-receive on a Linux host"
version = "0.1.0"
edition = "2024"
# Matches Ferrix's rust-toolchain.toml, which rustup finds from here.
rust-version = "1.97"
license = "MIT"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "lode-upload"
path = "src/bin/lode-upload.rs"

[[bin]]
name = "lode-receive"
path = "src/bin/lode-receive.rs"

[dependencies]
ferrix-lode-core = { path = "../../../../lib/log/lode" }
# TLS, without its own crypto (ring and aws-lc need a C compiler).
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
# The provider's primitives, all pure Rust, none with getrandom.
chacha20poly1305 = { version = "0.10.1", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "pkcs8", "pem", "zeroize"] }
sha2 = { version = "0.10.9", default-features = false }
hmac = { version = "0.12.1", default-features = false }
zeroize = { version = "1.8.1", default-features = false }
# Certificates for `lode-receive pair`, signed with our Ed25519 keys; its own
# crypto off.
rcgen = { version = "0.14.8", default-features = false, features = ["pem"] }
# Its certificates' dates.
time = { version = "0.3", default-features = false }
# getrandom(2) and flock(2), which std does not offer.
libc = "0.2.189"

[dev-dependencies]
# The interop check (tests/interop.rs): a peer on rustls's own ring provider.
# Host-only, test-only.
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_results = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
allow_attributes_without_reason = "deny"
