# The package manager: `/bin/pkg` (docs/APPS.md §7).
#
# A workspace of its own, not a member of Ferrix's, for the reason init's and
# zinc's are: a Linux user program built with std, speaking only the Linux
# ABI. What a package is -- the manifest, the record, the plan -- is
# `src/lib/proto/pkg`, the crate xtask builds images with, and the archive
# reader is the kernel's own `src/lib/fs/common/cpio`, so the program and the image
# build cannot disagree about either.
[package]
name = "pkg"
description = "Ferrix's package manager: list, inspect, install and remove packages"
version = "0.1.0"
edition = "2024"
# Matches Ferrix's rust-toolchain.toml, which rustup finds from here.
rust-version = "1.97"
license = "MIT"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pkg"
path = "src/main.rs"

[dependencies]
ferrix-cpio = { path = "../../../../lib/fs/common/cpio" }
ferrix-pkg = { path = "../../../../lib/proto/pkg" }

# The Ferrix discipline, as init's: every failing call is a line saying so,
# never an abort.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_results = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
doc_markdown = "warn"

[profile.dev]
overflow-checks = true
panic = "abort"

# Stripped: the release build is what goes into the initramfs.
[profile.release]
overflow-checks = true
strip = true
lto = true
codegen-units = 1
panic = "abort"
