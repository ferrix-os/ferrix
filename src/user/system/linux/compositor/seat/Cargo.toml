[package]
name = "compositor-seat"
description = "seat0's devices: opened by sessiond, which owns them, and handed to the session's compositor over a socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Declarations only: open, fcntl, poll and fstat are the C library std
# already links.
libc = "0.2.189"
compositor-socket = { path = "../socket" }
compositor-wire = { path = "../wire" }

[features]
# The trusted prompt's channel (docs/SETTINGS-WRITER.md §12): only in an
# image whose settings writer is present (ledger 3636 (10)); hyprix's and
# sessiond's features of the same name turn it on.
settings-prompt = []

[lints]
workspace = true
