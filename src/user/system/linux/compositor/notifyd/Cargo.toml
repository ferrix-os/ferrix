[package]
name = "compositor-notifyd"
description = "notifyd: the desktop's notifications -- org.freedesktop.Notifications on the session bus, and devmgr's driver deaths and restarts -- as banners at the top of the screen (docs/DESKTOP.md 4.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "notifyd"
path = "src/main.rs"

[lib]
name = "compositor_notifyd"
path = "src/lib.rs"

[dependencies]
compositor-dbus = { path = "../dbus" }
compositor-text = { path = "../text" }
compositor-toolkit = { path = "../toolkit" }

[lints]
workspace = true
