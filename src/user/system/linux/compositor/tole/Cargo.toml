[package]
name = "tole"
description = "Ferrix's UI framework: a retained item tree with typed properties and bindings, layouts and a CPU renderer, after Qt Quick (docs/UI-FRAMEWORK.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tole"
path = "src/lib.rs"

[dependencies]
# Fonts, shaping and glyphs: the desktop's own text.
compositor-text = { path = "../text" }
# What a frame is drawn with. The same exact pin as compositor-render and
# compositor-text, for the same reason; the default features stay off.
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true
