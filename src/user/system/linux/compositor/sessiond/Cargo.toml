[package]
name = "compositor-sessiond"
description = "seat0's owner: starts the graphical session as its user and hands its compositor the devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sessiond"
path = "src/main.rs"

[dependencies]
# Declarations only: setgroups, setgid, setuid, chown and dup2 are the C
# library std already links.
libc = "0.2.189"
compositor-seat = { path = "../seat" }
compositor-socket = { path = "../socket" }
compositor-wire = { path = "../wire" }
# The seat channel to authd (docs/AUTH.md §3.7): init's bootstrap, OPEN, and
# the ARM, DISARM and GRANT records.
ferrix-auth-proto = { path = "../../../../../lib/proto/auth-proto" }
ferrix-native = { path = "../../../../../lib/proto/native" }
ferrix-native-abi = { path = "../../../../../lib/proto/native-abi" }
# The session's scope, through the init's control socket (docs/INIT.md §5.6).
ferrix-svc-proto = { path = "../../../../../lib/init/svc-proto" }

[lints]
workspace = true
