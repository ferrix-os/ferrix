# Yoru: hyprix as the customer's "Yoru WM" design draws it (docs/DESKTOP.md
# §6), on the Nocturne design system. `source = <this file>` from a
# hyprland.conf, before the lines that should win over it, or as the whole
# configuration.
#
# The colours are Nocturne's tokens, written as hex:
#   ground    #161826   surface   #232532   text  #e9e9ed
#   accent    #9184d9   (OKLCH 0.66 0.125 289)
#   accent-2  hue 200, accent-3 hue 340: the "Nocturne" theme's triad, at
#             the accent's chroma on Nocturne's ramp (L .97 .92 .85 .77 .69
#             .59 .48 .37 .27 for 100 to 900)
#   accent-600 #796cbf  accent-2-500 #00b2ba  accent-3-500 #ce7bb4
#   neutral-400 #b2b6ca  neutral-700 #595d6c  neutral-800 #3f424d
# The accent is a line and a glow, never a flood.

# Floating first, as the design is; `settiled` still tiles a window, and a
# workspace may say `layout:master` for the design's auto-tile.
general {
    layout = floating
    gaps_in = 0
    gaps_out = 0
    float_gaps = 0
    border_size = 1
    # The focused window's 1-pixel ring is accent-600; every other window's
    # is the hairline of Nocturne's `shadow-md`, neutral-700.
    col.active_border = rgba(796cbfff)
    col.inactive_border = rgba(595d6c99)
    resize_on_border = true
    extend_border_grab_area = 8
    snap {
        enabled = true
        window_gap = 14
        monitor_gap = 14
    }
}

hyprix {
    # The blur on a GPU screen only: in software it is most of the frame.
    blur_in_software = 0
    own_frames = true
    titlebars = 1
    # The design's title bar: 34 px on the surface, the title at the left in
    # Inter 500, minimize, maximize and close as plain glyphs in
    # neutral-400, a hairline at its foot, and along a focused window's top
    # the accent's line, accent to accent-2 to accent-3, fading out over 48
    # px at each end.
    titlebar {
        height = 34
        rounding = 8
        col.active = rgba(232532ff)
        col.inactive = rgba(232532ff)
        col.text = rgba(e9e9edff)
        col.text_inactive = rgba(b2b6caff)
        col.button = rgba(00000000)
        col.line = rgba(9184d9ff) rgba(00b2baff) rgba(ce7bb4ff)
        col.separator = rgba(e9e9ed0f)
        button_size = 26
        button_gap = 2
        button_margin = 4
        title_align = left
        font_family = Inter Variable
        font_size = 13
        font_weight = 500
    }
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.6
    # Elevation on a dark ground is an edge and ambient darkness: the
    # focused window's deep drop, every other's Nocturne `shadow-md`.
    shadow {
        enabled = true
        range = 40
        render_power = 2
        offset = 0 16
        color = rgba(0000008c)
        color_inactive = rgba(00000066)
    }
    # And the focused one's halo of the accent, as the design's two glows
    # (accent up left, accent-2 down right) read from a distance.
    glow {
        enabled = true
        range = 36
        render_power = 3
        color = rgba(9184d940)
    }
    # What shows through the dock, the sidebars and a translucent window:
    # about the design's 22 px backdrop blur.
    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.0117
        contrast = 0.9
        brightness = 0.85
        vibrancy = 0.2
        popups = true
    }
}

# Nocturne's curve, `cubic-bezier(.2,.8,.2,1)`, for everything that moves:
# 0.2 s for a window, 0.28 s for a workspace.
animations {
    enabled = true
    bezier = yoru, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 2, yoru, popin 96%
    animation = windowsMove, 1, 2, yoru
    animation = workspaces, 1, 3, yoru, slidefade 4%
    animation = fade, 1, 2, yoru
    animation = layers, 1, 3, yoru, fade
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(161826)
}

# The dock and the sidebars are blurred behind (Yoru's shell, its
# `yoru-` namespaces); fuzzel too, which stands in for the palette.
layerrule = blur true, match:namespace ^(yoru-.*)$
layerrule = ignore_alpha 0.05, match:namespace ^(yoru-.*)$
layerrule = blur true, match:namespace ^(launcher)$

# The wallpaper: Nocturne's gradient, Ferrix's own. A person's picture or
# video is a `wallpaper =` line after this file, or Settings' Wallpaper
# page.
wallpaper = , picture /usr/share/backgrounds/yoru/yoru-nocturne.svg, fit stretch, colour rgb(161826)

# The notifications (docs/DESKTOP.md §4).
exec-once = notifyd

# The desktop's look for GTK and Chrome -- dark, the accent, Nocturne
# (org.freedesktop.portal.Settings) -- and its file chooser, Ferrix's own
# (org.freedesktop.portal.FileChooser, the chooser app). GTK goes to the
# portal outside a sandbox only when asked: GTK 3 by GTK_USE_PORTAL, GTK 4
# (4.18) by GDK_DEBUG's portals; every program the session starts has both.
env = GTK_USE_PORTAL,1
env = GDK_DEBUG,portals
exec-once = portald

# The keys are in yoru-keys.conf beside this file: a desktop with no
# configuration of its own sources both, one with its own sources this one
# alone, so that its own binds are the only ones.
