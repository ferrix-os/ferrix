# Ferrix light: hyprix as a floating desktop (docs/DESKTOP.md §2).
#
# `source = <this file>` from a hyprland.conf, after nothing that should
# win over it, or as the whole configuration. Every colour and size here
# is Ferrix's own; nothing is copied from another desktop's stylesheet.

# Every new window floats; `settiled` still tiles one by hand.
general {
    layout = floating
    gaps_in = 4
    gaps_out = 8
    float_gaps = 0
    border_size = 1
    col.active_border = rgba(00000030)
    col.inactive_border = rgba(00000020)
    resize_on_border = true
    extend_border_grab_area = 8
    snap {
        enabled = true
        window_gap = 12
        monitor_gap = 12
    }
}

# A window that draws its own frame (a GTK or libadwaita one) keeps it,
# with no second border round it; a maximized window has square corners
# and nothing round it.
hyprix {
    own_frames = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    shadow {
        enabled = true
        range = 22
        render_power = 2
        offset = 0 3
        color = rgba(00000059)
        color_inactive = rgba(00000033)
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 3, ease, popin 90%
    animation = workspaces, 1, 4, ease, slide
    animation = fade, 1, 3, ease
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(181f31)
}

# The keys a floating desktop has. SUPER alone, let go, opens and closes
# the overview of every window.
bindr = SUPER, SUPER_L, overview, toggle
bind = SUPER, Up, snapwindow, max
bind = SUPER, Down, snapwindow, restore
bind = SUPER, Left, snapwindow, left
bind = SUPER, Right, snapwindow, right
bind = ALT, F4, killactive
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev
bind = SUPER, Page_Down, workspace, e+1
bind = SUPER, Page_Up, workspace, e-1
bind = SUPER SHIFT, Page_Down, movetoworkspace, e+1
bind = SUPER SHIFT, Page_Up, movetoworkspace, e-1
bind = SUPER, H, minimize
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
