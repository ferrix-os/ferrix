# Yoru's keys (docs/DESKTOP.md §6), beside yoru.conf: `source` it after
# that file on a desktop that has no binds of its own.
#
# SUPER is the Yoru key (the customer, 2026-10-24: no Alt, so every
# program keeps its Alt and Ctrl keys). A key the desktop's own
# configuration binds already -- run-compositor's SUPER Return for the
# terminal, SUPER Q to close -- is not bound again here, since a key bound
# twice runs both.

# Find, run and switch.
bind = SUPER, space, exec, /bin/fuzzel --config /usr/share/hyprix/themes/yoru-fuzzel.ini
bind = SUPER, Tab, switcher, next
bind = SUPER SHIFT, Tab, switcher, prev
bindr = SUPER, Super_L, overview, toggle

# Snap: halves, top for the whole screen, down to restore; with SHIFT,
# the focus moves to the neighbour that way.
bind = SUPER, Left, snapwindow, left
bind = SUPER, Right, snapwindow, right
bind = SUPER, Up, snapwindow, max
bind = SUPER, Down, snapwindow, restore
bind = SUPER SHIFT, Left, movefocus, l
bind = SUPER SHIFT, Right, movefocus, r
bind = SUPER SHIFT, Up, movefocus, u
bind = SUPER SHIFT, Down, movefocus, d

# Tabs: a window grouped with the others as tabs, and the tabs walked.
bind = SUPER, G, togglegroup
bind = SUPER, bracketright, changegroupactive, f
bind = SUPER, bracketleft, changegroupactive, b

# Windows.
bind = SUPER, M, minimize

# The wallpaper switcher (yoru-shell's); pressed again, it closes.
bind = SUPER, I, exec, /bin/yoru-shell --walls

# The scratchpad: a special workspace dropped over everything.
bind = SUPER, S, togglespecialworkspace, scratch

# Workspaces 1 to 4: code, docs, misc, free.
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER, Next, workspace, e+1
bind = SUPER, Prior, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
