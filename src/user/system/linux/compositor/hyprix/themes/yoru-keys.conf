# Yoru's keys (docs/DESKTOP.md §6), beside yoru.conf: `source` it after
# that file on a desktop that has no binds of its own.
#
# Alt is the Yoru key, as the design has it; SUPER does the same, so a
# program that needs its Alt keys keeps them when this block is dropped.
$yoru = ALT

# Find, run and switch.
bind = CTRL, K, exec, /bin/fuzzel --config /usr/share/hyprix/themes/yoru-fuzzel.ini
bind = $yoru, space, exec, /bin/fuzzel --config /usr/share/hyprix/themes/yoru-fuzzel.ini
bind = SUPER, space, exec, /bin/fuzzel --config /usr/share/hyprix/themes/yoru-fuzzel.ini
bind = $yoru, Tab, switcher, next
bind = $yoru SHIFT, Tab, switcher, prev
bind = $yoru, grave, switcher, next
bind = SUPER, Tab, switcher, next
bind = SUPER SHIFT, Tab, switcher, prev
bindr = SUPER, Super_L, overview, toggle

# Apps.
bind = $yoru, Return, exec, /bin/term /bin/zinc
bind = SUPER, Return, exec, /bin/term /bin/zinc

# Snap: halves, top for the whole screen, down to restore.
bind = $yoru, Left, snapwindow, left
bind = $yoru, Right, snapwindow, right
bind = $yoru, Up, snapwindow, max
bind = $yoru, Down, snapwindow, restore
bind = SUPER, Left, snapwindow, left
bind = SUPER, Right, snapwindow, right
bind = SUPER, Up, snapwindow, max
bind = SUPER, Down, snapwindow, restore
bind = $yoru SHIFT, Left, movefocus, l
bind = $yoru SHIFT, Right, movefocus, r
bind = $yoru SHIFT, Up, movefocus, u
bind = $yoru SHIFT, Down, movefocus, d

# Tabs: a window grouped with the others as tabs, and the tabs walked.
bind = $yoru, G, togglegroup
bind = $yoru, bracketright, changegroupactive, f
bind = $yoru, bracketleft, changegroupactive, b

# Windows.
bind = $yoru, W, killactive
bind = $yoru, M, minimize
bind = ALT, F4, killactive

# The scratchpad: a special workspace dropped over everything.
bind = $yoru, S, togglespecialworkspace, scratch

# Workspaces 1 to 4: code, docs, misc, free.
bind = $yoru, 1, workspace, 1
bind = $yoru, 2, workspace, 2
bind = $yoru, 3, workspace, 3
bind = $yoru, 4, workspace, 4
bind = $yoru SHIFT, 1, movetoworkspace, 1
bind = $yoru SHIFT, 2, movetoworkspace, 2
bind = $yoru SHIFT, 3, movetoworkspace, 3
bind = $yoru SHIFT, 4, movetoworkspace, 4
bind = SUPER, Next, workspace, e+1
bind = SUPER, Prior, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = $yoru, mouse:272, movewindow
bindm = $yoru, mouse:273, resizewindow
