# Yoru's launcher (docs/DESKTOP.md §6, step Y3): fuzzel drawn as the design's
# command palette, a 600-pixel card on the surface at the top of the
# screen, the search glyph in accent-300, the picked row tinted with the
# accent. fuzzel reads it with `--config`; a person's own fuzzel.ini is
# what their own binds start it with.
[main]
font=Inter Variable:size=10.5,Phosphor:size=13
prompt="  "
placeholder=Search apps…
anchor=top
y-margin=150
width=52
lines=9
horizontal-pad=16
vertical-pad=14
inner-pad=10
line-height=30
icons-enabled=yes
match-counter=yes
minimal-lines=yes

[colors]
background=232532f7
text=cfd3e5ff
prompt=d2cefdff
placeholder=75798cff
input=e9e9edff
match=b5abfcff
selection=343449ff
selection-text=e9e9edff
selection-match=d2cefdff
counter=75798cff
border=595d6cff

[border]
width=1
radius=14
selection-radius=8
