[package]
name = "hyprix"
description = "The compositor: a Hyprland-shaped Wayland compositor for Ferrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hyprix"
path = "src/lib.rs"

[[bin]]
name = "hyprix"
path = "src/main.rs"

[dependencies]
# The evdev nodes the seat reads, and the rule for a program started as init.
compositor-evecho = { path = "../evecho" }
# The keymap the seat hands every client.
compositor-xkb = { path = "../xkb" }
compositor-anim = { path = "../anim" }
compositor-config = { path = "../config" }
compositor-regex = { path = "../regex" }
compositor-drm = { path = "../drm" }
compositor-seat = { path = "../seat" }
compositor-ipc = { path = "../ipc" }
compositor-layout = { path = "../layout" }
compositor-protocol = { path = "../protocol" }
compositor-render = { path = "../render" }
# The title in a title bar the compositor draws (docs/DESKTOP.md §2.2).
compositor-text = { path = "../text" }
# The device a GPU frame's streams run on: the render node, or a host's
# test server.
compositor-virgl = { path = "../virgl" }
compositor-server = { path = "../server" }
compositor-socket = { path = "../socket" }
compositor-wire = { path = "../wire" }
# The screenshot provider protocol to lode (docs/LOGGING.md §19).
ferrix-lode-capture = { path = "../../../../../lib/proto/lode-capture" }
# The evdev numbers the devices report.
ferrix-linux-abi = { path = "../../../../../lib/proto/linux-abi" }
# The bitmap face `debug:overlay` writes its numbers in.
ferrix-fbtext = { path = "../../../../../lib/kernel/fbtext" }
# The init's control records: each program started is put in a scope of
# its own (docs/INIT.md §5.6).
ferrix-svc-proto = { path = "../../../../../lib/init/svc-proto" }
# Declarations only: `mmap` of a client's pool, and `pause`.
libc = "0.2.189"

[dev-dependencies]
# The test runs the compositor and two clients in threads of one process and
# compares the pixels, which is the everyday gate src/user/system/linux/compositor/README.md names.
compositor-pattern = { path = "../pattern" }
# And a subscriber on the event socket, which is what a bar is.
compositor-ctl = { path = "../ctl" }
# The two halves of a clipboard, for the copy-and-paste test.
compositor-clip = { path = "../clip" }
# A taskbar with the drawing taken out, for the foreign-toplevel test.
compositor-lswt = { path = "../lswt" }
# And a screenshot program, for the screencopy test.
compositor-shot = { path = "../shot" }
# And a screen lock, for the session-lock test.
compositor-lock = { path = "../lock" }
# Shared memory, for the one client the tests bring themselves: what damage
# tracking has to be shown by is a client that repaints a corner of its
# window and says so, which `src/user/system/linux/compositor/pattern` does not do.
compositor-shm = { path = "../shm" }
# lode's screenshot protocol, for the crash-screenshot test.
ferrix-lode-capture = { path = "../../../../../lib/proto/lode-capture" }

[features]
default = ["settings-prompt"]
# The trusted prompt (docs/SETTINGS-WRITER.md §12.4): xtask builds hyprix
# without it for an image whose settings writer is absent (ledger 3636
# (10)), and then src/prompt_absent.rs stands in, with nothing to draw.
settings-prompt = ["compositor-seat/settings-prompt"]

[lints]
workspace = true
