[package]
name = "compositor-wallpaper"
description = "wallpaper: a picture, a colour, a slideshow or a video behind everything on every screen, fitted as a wallpaper line says, a layer surface per screen that follows screens coming and going"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wallpaper"
path = "src/main.rs"

[lib]
name = "compositor_wallpaper"
path = "src/lib.rs"

[dependencies]
compositor-config = { path = "../config" }
compositor-ctl = { path = "../ctl" }
compositor-image = { path = "../image" }
compositor-toolkit = { path = "../toolkit" }

[lints]
workspace = true
