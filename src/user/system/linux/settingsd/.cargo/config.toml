# A static program for Ferrix's initramfs, linkable from any host: the musl
# targets carry their own C runtime and `libc.a`, so rust-lld is the whole
# toolchain and Windows needs no Linux C compiler.
# `relocation-model=static` links a fixed-address executable rather than a
# static PIE, the shape busybox has and every kernel's ELF loader takes.
# armv7-unknown-linux-musleabi takes the same flags, but not from here: the
# repository's root config gives that target the ARM loader's linker script,
# and cargo merges rustflags across config files. `cargo xtask` builds settingsd
# with RUSTFLAGS set to these flags, which replaces both (tools/common/xtask/src/settingsd.rs).
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes", "-C", "target-feature=+crt-static", "-C", "relocation-model=static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes", "-C", "target-feature=+crt-static", "-C", "relocation-model=static"]
