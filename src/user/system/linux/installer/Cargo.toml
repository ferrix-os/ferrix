[package]
name = "ferrix-install"
description = "Ferrix's installer: a live disk's system onto a disk of its own (docs/INSTALLER.md)"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# A workspace of its own, as statd and adbd are: a static Linux program built
# with std against the target's own musl, for the initramfs
# (tools/common/xtask/src/installer.rs).
[workspace]

[lib]
name = "ferrix_install"
path = "src/lib.rs"

[[bin]]
name = "ferrix-install"
path = "src/main.rs"

# The running system's half of the second slot (docs/DEV-ON-FERRIX.md §4.4, D8).
[[bin]]
name = "bootctl"
path = "src/bootctl.rs"

[dependencies]
ferrix-argon2 = { path = "../../../../lib/crypto/argon2" }
ferrix-btrfs-mkfs = { path = "../../../../lib/fs/btrfs/mkfs" }
ferrix-partition = { path = "../../../../lib/fs/common/partition" }
ferrix-slots = { path = "../../../../lib/proto/slots" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
