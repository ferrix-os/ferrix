# Ferrix's `dmesg`: `/bin/dmesg`, the kernel log as util-linux's `dmesg` shows
# it -- `[    1.234567] text`, `-T` wall-clock times, `-x` facility and level,
# `-l`/`-f` filters, `-w` to follow -- read from `/dev/kmsg`, or through
# `syslog(2)` where there is none (src/lib.rs says what it takes).
#
# A workspace of its own, as dhcp's and pkg's are: a Linux user program built
# with std against the target's own musl, speaking only the Linux ABI.
[package]
name = "dmesg"
description = "Ferrix's dmesg: the kernel log from /dev/kmsg or syslog(2), as util-linux shows it"
version = "0.1.0"
edition = "2024"
# Matches Ferrix's rust-toolchain.toml, which rustup finds from here.
rust-version = "1.97"
license = "MIT"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "dmesg"
path = "src/main.rs"

[dependencies]
# klogctl, lseek's SEEK_DATA and fcntl's O_NONBLOCK switch, none of which
# std offers; the version dhcp and zinc already build with.
libc = "0.2.189"

[dev-dependencies]
# The kernel's own writer of both formats, which the tests read back.
ferrix-linux-abi = { path = "../../../../lib/proto/linux-abi" }

# The Ferrix discipline, as dhcp's: every failing call is a line saying so,
# never an abort. `unsafe` is only the libc calls in `src/sys.rs`, each with
# its SAFETY comment.
[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_results = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
doc_markdown = "warn"

[profile.dev]
overflow-checks = true
panic = "abort"

# Stripped: the release build is what goes into the initramfs.
[profile.release]
overflow-checks = true
strip = true
lto = true
codegen-units = 1
panic = "abort"
