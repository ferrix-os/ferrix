[package]
name = "ferrix-driver-model-examples"
description = "The driver model design page's two examples, an STM32 SPI controller and an LM75 on I2C, kept compiling against ferrix-driver as its test: linted for every architecture by cargo xtask check, never put in an image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "example-stm32-spi"
path = "src/stm32_spi.rs"
test = false
bench = false

[[bin]]
name = "example-lm75"
path = "src/lm75.rs"
test = false
bench = false

[dependencies]
ferrix-driver.workspace = true
ferrix-platform.workspace = true
ferrix-rt.workspace = true

[lints]
workspace = true
