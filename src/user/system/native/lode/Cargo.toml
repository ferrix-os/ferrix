[package]
name = "ferrix-lode"
description = "lode: the log manager -- the service init starts in a sealed job, and the reader (docs/LOGGING.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lode"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferrix-linux-abi.workspace = true
ferrix-lode-capture.workspace = true
ferrix-fat.workspace = true
ferrix-lode-core.workspace = true
ferrix-log-shed.workspace = true
ferrix-native-abi.workspace = true
ferrix-partition.workspace = true
ferrix-rt.workspace = true
# init's control records, for an alert's `start` (docs/LOGGING.md §7.4).
ferrix-svc-proto.workspace = true

# `lode reload`, the settings writer's part in lode (ledger 3623 (R18)): an image whose
# profile has settings_writer = "absent" builds lode without it, and xtask refuses one
# whose lode still holds it.
[features]
default = ["reload"]
reload = []

[lints]
workspace = true
