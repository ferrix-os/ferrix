[package]
name = "ferrix-native-abi"
description = "The Ferrix native system call ABI: numbers, handles, rights, signals and layouts"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
publish = false

[dependencies]
ferrix-errno = { workspace = true }

# The tests hold the native range clear of Linux's call numbers on every
# architecture (src/tests.rs); nothing of the library names the Linux ABI
# (docs/microkernel/CORE-WITHOUT-EXTENSIONS.md E2).
[dev-dependencies]
ferrix-linux-abi = { workspace = true }

[lints]
workspace = true
