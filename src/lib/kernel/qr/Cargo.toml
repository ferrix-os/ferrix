[package]
name = "ferrix-qr"
description = "QR code encoder for the panic screen, ported from Linux's drm_panic_qr.rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# The code is a port of an MIT-licensed file from Linux; see LICENSE-MIT for
# the notice it carries, which is the upstream author's rather than this tree's.
license = "MIT"
publish = false

[dependencies]

# Test-only, and never linked into the kernel (`check-crate-layering.sh`
# resolves normal edges only). Two independent implementations, so the symbol
# is checked from both ends: `rqrr` reads it back from a rendered image the
# way a phone camera would, and `qrcode` builds the same symbol from the same
# bits so the two matrices can be compared module for module — which catches
# a misplaced module that `rqrr`'s error correction would otherwise repair.
[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
qrcode = { version = "0.14.1", default-features = false }

[lints]
workspace = true
