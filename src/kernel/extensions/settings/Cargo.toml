[package]
name = "ferrix-kernel-settings"
description = "The Ferrix kernel's run-time setting entries: a removable load-ring crate a runtime_settings=fixed build leaves out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The one build script of the kernel's crates: the build flags as cfgs
# (docs/BUILD-FLAGS.md rule 6 b, docs/KERNEL-CRATES.md §6).
build = "../../build.rs"

# An optional part (docs/microkernel/CRATE-SPLIT.md §2.1, S1): its root is
# src/lib.rs, its modules under src/ at the module path they had in
# src/kernel/src, so `crate::settings::uts` names what it named before.
[lib]
path = "src/lib.rs"

[dependencies]
ferrix-audit.workspace = true
ferrix-bootinfo.workspace = true
ferrix-kernel-core.workspace = true
ferrix-kernel-load.workspace = true
ferrix-linux-abi.workspace = true
ferrix-procfs.workspace = true
ferrix-sysfs.workspace = true
ferrix-vfs.workspace = true

[lints]
workspace = true
