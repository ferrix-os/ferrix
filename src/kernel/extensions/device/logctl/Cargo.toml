[package]
name = "ferrix-kernel-logctl"
description = "The Ferrix kernel's end of the kernel log's control channel (ferrix-logctl): a load-ring part"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The one build script of the kernel's crates: the build flags as cfgs
# (docs/BUILD-FLAGS.md rule 6 b, docs/KERNEL-CRATES.md).
build = "../../../build.rs"

# An optional part (docs/microkernel/CRATE-SPLIT.md §2.1, S3): its modules
# under src/ at the module path they had in src/kernel/src
# (interfaces::logctl). Its lift twin, lift/, builds the same root for linuxd.
[lib]
path = "src/lib.rs"

[dependencies]
ferrix-kernel-core.workspace = true
ferrix-kernel-item.workspace = true
ferrix-blkring.workspace = true
ferrix-linux-abi.workspace = true
ferrix-logctl.workspace = true
ferrix-native-abi.workspace = true
ferrix-sched-fair.workspace = true

[lints]
workspace = true
