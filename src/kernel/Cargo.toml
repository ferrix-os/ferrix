[package]
name = "ferrix-kernel"
description = "The Ferrix kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ferrix-kernel"
path = "src/main.rs"

[dependencies]
ferrix-kernel-load.workspace = true
# The removable run-time setting entries: always compiled, linked only when
# the composition root names them, under runtime_settings=live
# (docs/KERNEL-CRATES.md §6; ledger 3558 (10), 3623 (R1)).
ferrix-kernel-settings.workspace = true
ferrix-linux-abi.workspace = true
ferrix-bootinfo.workspace = true
ferrix-crng.workspace = true
ferrix-elf.workspace = true
ferrix-paging.workspace = true
ferrix-kernel-sched-select.workspace = true
ferrix-sched-class.workspace = true
ferrix-smbios.workspace = true
ferrix-sync.workspace = true
ferrix-ustack.workspace = true

[lints]
workspace = true
