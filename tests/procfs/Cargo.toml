[package]
name = "procfs-test"
description = "/proc as lsof and a 32-bit Steam client read it: descriptor links stat to their objects, inode numbers fit 32 bits"
version = "0.1.0"
edition = "2024"
# Matches Ferrix's rust-toolchain.toml, which rustup finds from here.
rust-version = "1.97"
license = "MIT"
publish = false

# A workspace of its own, not a member of Ferrix's, for the reason zinc and the
# compositor are: it is a Linux user program built with std, and the Ferrix
# workspace's dependency policy is written for a kernel.
[workspace]

[[bin]]
name = "procfs-test"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[features]
# Stat the descriptor links with `lstat` where the test means `stat`, so the
# link steps must fail on their first comparison with `fstat`.
negative-fd = []
# Hold /proc's inode numbers to 16 bits instead of 32, so the inode step must
# fail: every process's numbers are above 2^17.
negative-ino = []
# Hold /proc's directory offsets to 16 bits instead of 31, so the inode step
# must fail: the process directories' offsets start at 2^16.
negative-off = []

# ---------------------------------------------------------------------------
# Lints
#
# The Ferrix discipline, as zinc and the compositor keep it: every failure is
# a line on the console and a status, never a panic. `unsafe` is allowed: the
# calls under test are libc's, and every block says what it relies on.
# ---------------------------------------------------------------------------
[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_results = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
overflow-checks = true
panic = "abort"
strip = true
