name: Release

# A pushed release tag becomes a GitHub Release, which is what reaches the
# people watching the repository ("Custom -> Releases") and puts a release on
# the repository's front page. The notes are the tag's section of
# docs/RELEASES.md, so write that section before pushing the tag; the job
# fails rather than publish a release with no notes.
#
# A dry run builds the three asset jobs exactly as a tag does, from the
# commit given, and keeps what they make as the run's artifacts instead:
# it makes no release and uploads nothing to one. Run one before pushing a
# release tag, since a release's downloads come from hosts that may turn
# GitHub's runners away (v0.1.0's did, docs/RELEASES.md):
#
#     gh workflow run release.yml -f dry_run=true -f ref=<commit>

on:
  push:
    tags: ["v*", "stage-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to publish a release for (a dry run names its files after it, or "dry-run")
        required: false
      dry_run:
        description: Build the assets as for a tag and keep them as the run's artifacts; no release
        type: boolean
        default: false
      ref:
        description: The commit or branch a dry run builds (default the tag, else the branch run from)
        required: false
      draft:
        description: Make the release a draft, for the owner to publish (a new release only)
        type: boolean
        default: false

permissions:
  contents: write

# The tag the release and its assets are named for: a dry run's files are
# named for the tag given, or for "dry-run".
env:
  TAG: ${{ inputs.tag || (inputs.dry_run && 'dry-run') || github.ref_name }}

jobs:
  release:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$INPUT_TAG" ]; then
            echo "a release needs a tag; to build the assets without one, run with dry_run" >&2
            exit 1
          fi
          python3 tools/common/gen/release-notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
          title=$(python3 tools/common/gen/release-notes.py --title "$TAG")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            draft=
            [ "$INPUT_DRAFT" = true ] && draft=--draft
            gh release create "$TAG" --verify-tag $draft --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  # The Pixel 7 app's desktop, in two editions as a distribution has them:
  # `full`, with Chromium, whose Debian arm64 volume goes on the release
  # beside it, and `minimal`, the desktop alone. The app keeps the phone on
  # the newest release that carries its edition (tools/vendor/google/pixel7/README.md,
  # "Updates"), so these assets are what it installs. Each edition is the
  # build `tools/vendor/google/pixel7/build-desktop.sh` makes by hand, with ferrousli's
  # busybox and the AArch64 ports in it as on a developer's machine.
  pixel7:
    name: Pixel 7 desktop (${{ matrix.edition }})
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (inputs.dry_run && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [full, minimal]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          # `llvm-objcopy`, which turns the loader into the raw Image.
          components: llvm-tools
          targets: aarch64-unknown-none-softfloat, aarch64-unknown-linux-musl, aarch64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pixel7

      # The target's gcc builds busybox and the ports against ferrousli;
      # mkfs.btrfs makes Chromium's volume.
      - name: Install the cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu btrfs-progs

      # One target directory for every workspace the build reaches (the
      # kernel's, ferrousli's, the compositor's, zinc's), which the cache
      # above keeps.
      - name: Build busybox and the ports
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo xtask busybox --arch aarch64
          cargo xtask ports --arch aarch64

      # oh-my-zsh and zsh's functions at their pins, which the desktop
      # carries beside zinc, so the edition's licence inventory names the
      # trees it ships (docs/LICENSES.md).
      - name: Fetch the shell trees
        run: |
          eval "$(tools/common/fetch/fetch-shell-trees.sh "$RUNNER_TEMP/shell")"
          echo "FERRIX_OMZ=$FERRIX_OMZ" >> "$GITHUB_ENV"
          echo "FERRIX_ZSH_FUNCTIONS=$FERRIX_ZSH_FUNCTIONS" >> "$GITHUB_ENV"
          echo "FERRIX_SHELL_TREES=$RUNNER_TEMP/shell" >> "$GITHUB_ENV"

      - name: Fetch Chromium's volume
        if: matrix.edition == 'full'
        env:
          FERRIX_CHROMIUM_VOLUME: ${{ runner.temp }}/chromium
        run: tools/common/fetch/fetch-chromium-arm64.sh

      - name: Build the desktop
        env:
          FERRIX_CHROMIUM_VOLUME: ${{ runner.temp }}/chromium
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: sh tools/vendor/google/pixel7/build-desktop.sh "$RUNNER_TEMP/desktop" ${{ matrix.edition == 'full' && '--chrome' || '' }}

      - name: Pack it
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          volume=
          [ "$EDITION" = minimal ] || volume="--volume $RUNNER_TEMP/chromium/chromium.img"
          python3 tools/vendor/google/pixel7/package-release.py "$EDITION" "$RUNNER_TEMP/desktop" \
            "$RUNNER_TEMP/assets" "$TAG" "$(git rev-parse HEAD)" $volume
          # The edition's licence inventory, read off its own initramfs; it
          # fails the job as the desktop's does. Its busybox's source, and the
          # Chromium volume's package list, are in the sources asset.
          python3 tools/common/release/licences.py --initrd "$RUNNER_TEMP/desktop/stage/FERRIX/INITRD.IMG" \
            --out "$RUNNER_TEMP/licences" --tag "$TAG" --title "Pixel 7 desktop, $EDITION edition"
          cp "$RUNNER_TEMP/licences/THIRD-PARTY-LICENSES.md" \
            "$RUNNER_TEMP/assets/ferrix-pixel7-$EDITION-THIRD-PARTY-LICENSES.md"
          ls -l "$RUNNER_TEMP"/assets

      - name: Attach it to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber

      - name: Keep it as the dry run's artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-${{ matrix.edition }}
          path: ${{ runner.temp }}/assets/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # The x86-64 desktop for somebody with QEMU and nothing else: one zip, the
  # image `cargo xtask release-image` writes beside run.sh, run.ps1 and a
  # README, which README.md's "Try it without building" downloads. What it
  # leaves out (Chrome, Steam and rustc's volumes, a kept root disk) its
  # README.txt says, and why.
  desktop:
    name: x86-64 desktop for QEMU
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (inputs.dry_run && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools
          targets: x86_64-unknown-none, x86_64-unknown-uefi, x86_64-unknown-linux-musl, x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-x86_64

      # What the apps' build scripts run on the host: autotools for
      # alsa-lib, meson and ninja for foot and Mesa, cmake for glslang,
      # bison and flex, Python's mako for Mesa, wayland-scanner.
      - name: Install the apps' build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config cmake meson ninja-build \
            bison flex gperf python3-mako libwayland-bin

      # The image's busybox is ferrousli's, and the apps link against the
      # ports; release-image builds every app it carries that has no
      # package yet, and stops if one fails.
      - name: Build busybox and the ports
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo xtask busybox --arch x86_64
          cargo xtask ports --arch x86_64

      # Fetches the pinned shell trees, builds the image, and writes its
      # licence inventory, which fails the job when any part of the image has
      # no licence release-licences.toml allows (docs/LICENSES.md).
      - name: Build and pack the desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python3 tools/common/release/package-desktop.py "$RUNNER_TEMP/desktop" --tag "$TAG"

      # The source of every GPL and LGPL program in this release's assets,
      # the Pixel 7 editions' busybox and Chromium volume included, from the
      # downloads the build above just checked against their pins.
      - name: Pack the corresponding sources
        run: |
          python3 tools/common/release/package-sources.py "$RUNNER_TEMP/sources" --tag "$TAG" \
            --fetch --inventory "$RUNNER_TEMP/desktop/licences/licences.json"

      - name: Gather the assets
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          cp "$RUNNER_TEMP/desktop/ferrix-x86_64-desktop.zip" \
            "$RUNNER_TEMP/desktop/ferrix-x86_64-desktop.zip.sha256" \
            "$RUNNER_TEMP/desktop/ferrix-$TAG-THIRD-PARTY-LICENSES.md" \
            "$RUNNER_TEMP/sources/ferrix-$TAG-sources.tar.gz" \
            "$RUNNER_TEMP/assets/"
          # The desktop's wallpaper, the one the image shows, at three
          # sizes (docs/brand/wallpaper/; our own artwork, MIT).
          cp docs/brand/wallpaper/ferrix-wallpaper-*.png "$RUNNER_TEMP/assets/"
          ls -l "$RUNNER_TEMP"/assets

      - name: Attach it to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --clobber "$RUNNER_TEMP"/assets/*

      - name: Keep it as the dry run's artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-x86_64
          path: ${{ runner.temp }}/assets/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # The live ISO (docs/TRY-FERRIX.md): the release desktop as a live session
  # with the installer, in a hybrid ISO that boots as a CD and as a USB
  # stick, `cargo xtask iso` writes; its licence inventory, which the build
  # itself refuses an unaccounted part of the image in; and SHA256SUMS over
  # both. A development preview: the `present` profile, slot signing off.
  iso:
    name: x86-64 live ISO
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (inputs.dry_run && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools
          targets: x86_64-unknown-none, x86_64-unknown-uefi, x86_64-unknown-linux-musl, x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-x86_64

      - name: Install the apps' build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config cmake meson ninja-build \
            bison flex gperf python3-mako libwayland-bin

      - name: Build busybox and the ports
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo xtask busybox --arch x86_64
          cargo xtask ports --arch x86_64

      - name: Fetch the shell trees
        run: |
          eval "$(tools/common/fetch/fetch-shell-trees.sh "$RUNNER_TEMP/shell")"
          echo "FERRIX_OMZ=$FERRIX_OMZ" >> "$GITHUB_ENV"
          echo "FERRIX_ZSH_FUNCTIONS=$FERRIX_ZSH_FUNCTIONS" >> "$GITHUB_ENV"
          echo "FERRIX_SHELL_TREES=$RUNNER_TEMP/shell" >> "$GITHUB_ENV"

      - name: Build the ISO
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo xtask iso --arch x86_64

      - name: Gather the assets
        run: |
          mkdir -p "$RUNNER_TEMP/iso"
          cp build/x86_64/ferrix-live.iso "$RUNNER_TEMP/iso/ferrix-$TAG-x86_64.iso"
          cp build/x86_64/live-licences/THIRD-PARTY-LICENSES.md \
            "$RUNNER_TEMP/iso/ferrix-$TAG-x86_64-iso-THIRD-PARTY-LICENSES.md"
          (cd "$RUNNER_TEMP/iso" && sha256sum ferrix-*.iso ferrix-*-iso-THIRD-PARTY-LICENSES.md > SHA256SUMS)
          cat "$RUNNER_TEMP/iso/SHA256SUMS"

      - name: Attach it to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --clobber "$RUNNER_TEMP"/iso/*

      - name: Keep it as the dry run's artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: iso-x86_64
          path: ${{ runner.temp }}/iso/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
