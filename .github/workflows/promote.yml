name: Promote

# Moves what landed on develop to main without anyone clicking
# (docs/REPO-FLOW.md, "Promotion"). On every push to develop, when a
# promotion's CI ends, and every 15 minutes as a fallback:
#
#   1. if a promotion branch promote/<sha> has CI green, its `flow/lane` and
#      `certification/verdict` green, and main is an ancestor of it, push it
#      to main as a fast-forward and delete the branch;
#   2. if a promotion's CI is still running, do nothing: the next promotion
#      takes everything that lands in the meantime;
#   3. otherwise, if develop has commits main lacks and no promotion carries
#      develop's tip, cut promote/<sha> at develop's tip, post its
#      `flow/lane` (owner: only trusted pushers reach develop) and its
#      `certification/verdict` (cert-verdict.py over main..develop), and
#      start ci.yml on it with workflow_dispatch. A promotion whose CI ended
#      and that cannot reach main (red, its verdict waiting) is superseded:
#      its branch is deleted once develop has moved past it.
#
# No pull request is opened. A promotion pull request requested a review from
# the code owner on every promotion (CODEOWNERS is read from main, which
# carries develop's file), and the owner's inbox filled with them
# (customer, 2026-10-24). main's ruleset still demands the three checks on
# the pushed commit and refuses anything but a fast-forward; only its
# pull-request rule lets this workflow's token (the GitHub Actions app)
# through, in a ruleset of its own.
#
# Everything here uses the workflow's own token, so the push to main starts
# no push run there: CI ran once, on the promoted commit.

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["promote/**"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write
  actions: write   # dispatch ci.yml

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote develop to main
    # Inert until github-flow-setup.sh switch sets the variable: before the
    # switch develop is not where landings go, and promoting it would be wrong.
    if: vars.FLOW_PROMOTE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Advance main, or start a promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          R="$GITHUB_REPOSITORY"
          git fetch -q --prune origin '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/develop:refs/remotes/origin/develop' '+refs/heads/promote/*:refs/remotes/origin/promote/*'
          status_ok() { # status_ok SHA CONTEXT
            [ "$(gh api "repos/$R/commits/$1/status" \
                  --jq "[.statuses[] | select(.context == \"$2\")][0].state // \"none\"")" = success ]
          }
          ci_state() { # ci_state BRANCH -> running|success|failed|none
            gh run list --repo "$R" --workflow ci.yml --branch "$1" --limit 1 \
              --json status,conclusion --jq '.[0] // empty | if .status != "completed" then "running" elif .conclusion == "success" then "success" else "failed" end'
          }
          running=0
          for b in $(git branch -r --format='%(refname:lstrip=3)' | grep '^promote/' | sort -r || true); do
            sha=$(git rev-parse "origin/$b")
            if git merge-base --is-ancestor "$sha" origin/main; then
              git push -q origin --delete "$b" || true; continue
            fi
            state=$(ci_state "$b"); state=${state:-none}
            if [ "$state" = running ]; then running=1; echo "$b: CI running"; continue; fi
            if [ "$state" = success ] && status_ok "$sha" "CI result" && status_ok "$sha" flow/lane \
               && status_ok "$sha" certification/verdict && git merge-base --is-ancestor origin/main "$sha"; then
              git push origin "$sha:refs/heads/main"
              echo "main advanced to $b"
              git push -q origin --delete "$b" || true
              git fetch -q origin '+refs/heads/main:refs/remotes/origin/main'
              continue
            fi
            # Ended and cannot reach main (red, verdict waiting or NOT-YET).
            # It stays while it carries develop's tip, so the verdict can
            # still arrive; once develop has moved on, a newer one replaces it.
            if [ "$sha" != "$(git rev-parse origin/develop)" ]; then
              echo "$b: CI $state, superseded by develop's newer tip"
              git push -q origin --delete "$b" || true
            else
              echo "$b: CI $state, carries develop's tip; waiting for a fix or a verdict"
            fi
          done
          git fetch -q --prune origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/promote/*:refs/remotes/origin/promote/*'
          [ "$running" = 0 ] || exit 0
          tip=$(git rev-parse origin/develop); short=${tip:0:9}
          ahead=$(git rev-list --count origin/main..origin/develop)
          if [ "$ahead" = 0 ]; then echo "develop has nothing main lacks"; exit 0; fi
          if git rev-parse -q --verify "origin/promote/$short" >/dev/null; then
            echo "promote/$short already carries develop's tip"; exit 0
          fi
          git push -q origin "$tip:refs/heads/promote/$short"
          gh api -X POST "repos/$R/statuses/$tip" -f state=success \
             -f context=flow/lane -f "description=owner lane: promotion of develop"
          python3 tools/common/release/cert-verdict.py "origin/main..$tip" --lane owner --post "$tip"
          base=$(git merge-base origin/main "$tip")
          gh workflow run ci.yml --repo "$R" --ref "promote/$short" -f "base=$base"
          echo "promote/$short started: $ahead commits"
          git log --no-merges --format='  %h %s' origin/main.."$tip" | head -40
