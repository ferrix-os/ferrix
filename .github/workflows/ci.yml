name: CI

# The gate set ported from the Starling workspace:
#   fmt --check | clippy -D warnings | tests | cargo-deny | Miri | fuzz
# plus the three this project needs and a userspace program cannot have: the
# assembly allow-list, the unsafe audit that stands in for `unsafe_code =
# "deny"`, and a QEMU boot on every architecture, which is the only test that
# can tell us the thing actually runs.

on:
  # Since 2026-10-23 (docs/REPO-FLOW.md) CI runs on what is about to reach
  # main or develop, not on every landing: a pull request to either (an
  # outside contribution, an owner's feature), a promotion of develop to main
  # (the Promote workflow dispatches this file on its promote/<sha> branch,
  # since a pull request its own token opens starts no run), and develop
  # nightly. A push to main runs it too, which after the switch is only a
  # direct push by an administrator: a promotion merges with the workflow's
  # token, and that push starts no run, so the promoted commit is not
  # checked twice. develop's own pushes, many an hour, run nothing here; the
  # gate pool has run each landing's rows before it reached develop.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      base:
        description: The commit the run's range starts at, for the one-author check (the Promote workflow passes main's merge base)
        required: false

# A pull request's code runs here with a read-only token and no secrets,
# whoever wrote it; jobs that need more ask for it themselves.
permissions:
  contents: read

# Only the newest commit on a branch needs a verdict. main is pushed after
# every landing, often several times an hour, and each run is about twenty
# jobs; on 2026-09-27 twenty-five runs stood queued and none had started in
# an hour. One run per branch runs at a time and one waits: a newer push
# replaces the waiting run, and the running one is left to finish -- with
# cancel-in-progress, pushes every quarter hour would cancel every run
# before it ended and no commit would ever get a verdict. The one-author job
# checks the range its own push adds, so a replaced run leaves that range to
# the pre-push hook, which checks every push before it leaves the machine.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # No RUSTFLAGS here, and there must never be one. Cargo lets the variable
  # *replace* `[target.*].rustflags` in `.cargo/config.toml` rather than add to
  # it, which silently drops the kernel's linker script: the image still builds,
  # and the loader refuses it at boot because nothing is linked where it maps
  # it. That is how this workflow lost its first boot test. Warnings are denied
  # where they are checked -- `-- -D warnings` on every clippy step below -- and
  # `xtask` refuses to build a kernel with the variable set.

jobs:
  # ----------------------------------------------------------------
  # One author per commit. `.githooks` checks this twice, and both of
  # those checks are hooks -- so both are dormant until somebody runs
  # `git config core.hooksPath .githooks` in their clone, which is local
  # configuration and cannot be committed. Nobody ran it, and eight
  # co-authored commits were written and seven pushed with neither hook
  # ever executing. This is the check that does not have to be armed.
  # ----------------------------------------------------------------
  authorship:
    name: One author per commit
    runs-on: ubuntu-latest
    steps:
      # The full history, because the gate works over the range between two
      # commits and a shallow clone does not contain the base.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only the range this push or pull request *adds*, never the whole tree:
      # the history that already carries the trailer is public, and a gate that
      # failed on it forever would be turned off within a day.
      - name: No commit carries a Co-authored-by trailer
        env:
          BASE: ${{ github.event_name == 'pull_request'
                    && github.event.pull_request.base.sha
                    || github.event_name == 'workflow_dispatch'
                    && inputs.base
                    || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request'
                    && github.event.pull_request.head.sha
                    || github.sha }}
        run: python3 tools/common/check/check-commit-authors.py "$BASE" "$HEAD"

  # ----------------------------------------------------------------
  # The founding claim, checked rather than asserted: this OS is written
  # in Rust, and assembly appears only where the machine leaves no choice.
  # ----------------------------------------------------------------
  assembly:
    name: Assembly allow-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Through the interpreter rather than the shebang: the runner has it, and
      # a contributor on Windows has `python` but no `python3`, where relying on
      # the shebang fails with a Microsoft Store message instead of a result.
      - name: Assembly stays inside its allow-list and budget
        run: python3 tools/common/check/check-asm-budget.py

      # The number is the point, so put it in the run summary where it is read
      # without opening a log.
      - name: Report the Rust share
        if: always()
        run: |
          {
            echo '### Assembly budget'
            echo '```'
            python3 tools/common/check/check-asm-budget.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------
  # `unsafe_code = "deny"` is the one Starling gate a kernel cannot
  # inherit, so the burden moves to every unsafe site instead.
  # ----------------------------------------------------------------
  audits:
    name: Unsafe and panic audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A CRLF in a shell script makes its `#!` line unparseable, and bash
      # reports it as `$'\r': command not found` -- naming neither the file's
      # real problem nor the line that has it.
      - name: Text files use LF
        run: python3 tools/common/check/check-line-endings.py

      # The kernel enumerates devices and drives none. Without this, the
      # claim survives exactly as long as nobody is in a hurry.
      - name: Device registers are touched only where the architecture allows
        run: python3 tools/common/check/check-device-access.py

      - name: Every unsafe construct is justified at the site
        run: python3 tools/common/check/check-unsafe-audit.py

      # The lints deny the panicking macros; this asserts that the exemptions
      # left behind are argued ones. Without it the deny is one `#[allow]` away
      # from meaning nothing, and nobody would notice.
      - name: Every panic-lint exemption is argued
        run: python3 tools/common/check/check-panic-audit.py

  # ----------------------------------------------------------------
  # docs/generated/ is written from docs/sysml/ and committed, so the
  # document is readable on GitHub and its diff sits beside the model
  # change that caused it. This job regenerates and compares: a model
  # edited without regenerating fails here, and the fix is one command.
  #
  # It installs nothing. The reader in tools/common/gen/sysml/ is stdlib Python,
  # because a gate that needs a pip install is a gate that does not run
  # on a stock checkout.
  # ----------------------------------------------------------------
  model:
    name: Architecture document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The reader is the one thing here that parses a language, and a reader
      # that quietly misunderstands a construct produces a wrong document
      # rather than a failed build.
      - name: The model reader and the renderers behave
        run: python3 tools/common/gen/sysml/tests.py

      - name: The generated document matches the model
        run: python3 tools/common/gen/gen-arch-doc.py --check

      # Useful on a red run: the regenerated document, to diff by eye.
      - name: Regenerate for inspection
        if: failure()
        run: python3 tools/common/gen/gen-arch-doc.py --out "$RUNNER_TEMP/model-doc"

      - name: Upload the regenerated document
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-document
          path: ${{ runner.temp }}/model-doc

  # ----------------------------------------------------------------
  # The loader and the kernel are two programs that meet at one struct,
  # and the CPU is reached through one facade. A build failure enforces
  # what a design document could not.
  # ----------------------------------------------------------------
  layering:
    name: Crate layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Layering holds
        run: tools/common/check/check-crate-layering.sh

  # ----------------------------------------------------------------
  # Format, lint and test: `cargo xtask check`, the same command a
  # landing runs, and so every gate in it -- fmt, the audits, the
  # generated documents, clippy on the host and once per freestanding
  # target (`#[cfg(target_arch)]` code is invisible to a lint pass for
  # the other machine), the host tests and doc tests, the compositor and
  # the userland programs.
  #
  # Until 2026-09-28 a Linux `test` job ran the lints and the host tests
  # a second time beside it, ten of the run's minutes spent on nothing
  # the check had not already said.
  # ----------------------------------------------------------------
  check:
    name: cargo xtask check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          # The musl targets beside the freestanding ones: `check` lints each
          # Linux app for them (docs/APPS.md §5), whichever apps there are.
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat, armv7a-none-eabi, x86_64-unknown-uefi, aarch64-unknown-uefi, armv7-unknown-linux-musleabi, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      # Every workspace the check builds. Until 2026-09-28 this named
      # `compositor`, which the regroup of 2026-09-26 moved under
      # `src/user/system/linux/`: its target was never saved, and the compositor was
      # three minutes of compiling on every run.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/user/system/linux/compositor -> target
            src/user/system/linux/init -> target
            src/user/system/linux/auth -> target
            src/user/system/linux/media -> target
            src/user/system/linux/adbd -> target
            src/user/system/linux/pkg -> target
            src/user/system/linux/dhcp -> target

      # `cargo xtask check` first asks whether the commit hooks are armed,
      # which is local configuration a fresh checkout does not have.
      - name: Arm the commit hooks
        run: git config core.hooksPath .githooks

      - name: cargo xtask check
        run: cargo xtask check

  # ----------------------------------------------------------------
  # The host tests on Windows: the coverage that is actually
  # OS-specific -- xtask writes a FAT image and drives QEMU, and both of
  # those behave differently there. fmt, clippy and the doc checks are
  # platform-portable, and the `check` job runs them.
  # ----------------------------------------------------------------
  test:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat, armv7a-none-eabi, x86_64-unknown-uefi, aarch64-unknown-uefi, armv7-unknown-linux-musleabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # The freestanding crates cannot run tests -- there is no host to run
      # them on -- which is exactly why the algorithmic core lives in src/lib/.
      - name: Tests
        run: cargo xtask host-test

  # ----------------------------------------------------------------
  # ferrousli, the C library in Rust, is a cargo workspace of its own,
  # so the host steps' `--workspace` never reaches it. Since 2026-09-13
  # it is on the goal's path, and this job is its gate: the steps
  # `cargo xtask check --ferrousli` adds to the whole local gate --
  # ferrousli's generated-ABI check, fmt, clippy, and its tests in the
  # debug and release profiles -- beside the `check` job, which runs the
  # rest. Until 2026-09-28 this job ran the whole gate again first.
  #
  # Seven of its unit tests compare with the glibc the test binary
  # links and skip on any other version than the one their data was
  # recorded on (src/user/system/linux/ferrousli/src/host_glibc.rs); this runner's glibc
  # differs, so they print a note and every other test runs.
  # ----------------------------------------------------------------
  ferrousli:
    name: ferrousli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat, armv7a-none-eabi, x86_64-unknown-uefi, aarch64-unknown-uefi, armv7-unknown-linux-musleabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/user/system/linux/ferrousli -> target

      # ferrousli's math tests judge every function against libc-test's
      # tables, read from a checkout at FERROUSLI_LIBC_TEST, never copied
      # (src/user/system/linux/ferrousli/src/math/mtest.rs). This is the commit the landings are
      # gated against; move it here and in mtest.rs together.
      - name: Fetch libc-test's tables
        env:
          LIBC_TEST_COMMIT: 7b95dfa5f5d5ca4d949221e0228ccc290bacc14e
        run: |
          git clone --quiet https://repo.or.cz/libc-test.git "$RUNNER_TEMP/libc-test"
          git -C "$RUNNER_TEMP/libc-test" checkout --quiet --detach "$LIBC_TEST_COMMIT"
          test "$(git -C "$RUNNER_TEMP/libc-test" rev-parse HEAD)" = "$LIBC_TEST_COMMIT"
          echo "FERROUSLI_LIBC_TEST=$RUNNER_TEMP/libc-test" >> "$GITHUB_ENV"

      - name: cargo xtask check-ferrousli
        run: cargo xtask check-ferrousli

  # ----------------------------------------------------------------
  # The artefacts: a bootable image per architecture.
  # ----------------------------------------------------------------
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, armv7a]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat, armv7a-none-eabi, x86_64-unknown-uefi, aarch64-unknown-uefi, armv7-unknown-linux-musleabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.arch }}

      - name: Build the bootable image
        run: cargo xtask build --arch ${{ matrix.arch }} --release

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: ferrix-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/
          if-no-files-found: error

  # ----------------------------------------------------------------
  # The only test that answers the question that matters.
  #
  # Everything above checks the source. This boots it: firmware hands off
  # to the loader, the loader hands off to the kernel, and the kernel
  # reports over the serial port and shuts the machine down. An OS that
  # compiles and does not boot is not a passing build.
  # ----------------------------------------------------------------
  boot:
    name: Boot in QEMU (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, armv7a]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-none, aarch64-unknown-none-softfloat, armv7a-none-eabi, x86_64-unknown-uefi, aarch64-unknown-uefi, armv7-unknown-linux-musleabi
          # `llvm-objcopy`, which `--strip-kernel` strips the kernel with.
          components: llvm-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.arch }}

      # `ovmf` and `qemu-efi-aarch64` are the 64-bit pair's firmware images;
      # without them QEMU boots to a SeaBIOS prompt and the test times out with
      # no clue why. `u-boot-qemu` is ARMv7-A's: EDK2's 32-bit Arm build is on
      # its way out of the distributions, and U-Boot is what the boards run.
      - name: Install QEMU and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 u-boot-qemu

      # x86-64 boots need the QEMU tools/common/fetch/fetch-qemu-linux.sh
      # builds, whose intel-iommu blocks compatibility-format interrupts
      # (docs/NVIDIA.md §12.3); xtask refuses any other. Cached by the hash
      # of the script and the patches it applies.
      - name: Cache the patched QEMU
        id: qemu-cache
        if: matrix.arch == 'x86_64'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/ferrix/qemu
          key: qemu-ferrix-cfi-${{ runner.os }}-${{ hashFiles('tools/common/fetch/fetch-qemu-linux.sh', 'tools/common/data/qemu/**') }}

      # On every run, not only when building: a cached QEMU still needs the
      # libraries it was linked against, and without them `--version` fails
      # and xtask refuses the boot.
      - name: Install the patched QEMU's libraries
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libgtk-3-dev libepoxy-dev libgbm-dev \
            libvirglrenderer-dev libspice-protocol-dev libpulse-dev \
            libpipewire-0.3-dev libasound2-dev libzstd-dev libslirp-dev

      - name: Build the patched QEMU
        if: matrix.arch == 'x86_64' && steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3-venv flex bison git pkg-config
          tools/common/fetch/fetch-qemu-linux.sh

      - name: Boot
        run: cargo xtask test-boot --arch ${{ matrix.arch }} --release --timeout 120

      # The smallest machine every architecture boots today, so that what
      # Ferrix needs cannot grow unseen (docs/SMALL-MEMORY.md). 128 MiB is
      # the firmware's floor as much as ours: EDK2 refuses to start aarch64
      # in less, U-Boot runs out below 48 MiB, and the loader, holding the
      # kernel file, the kernel and the initramfs at once, below 128 MiB.
      - name: Boot in 128 MiB
        run: cargo xtask test-boot --arch ${{ matrix.arch }} --release --strip-kernel --memory 128 --timeout 120

      - name: Keep the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/serial.log
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Stage 16's exit: `rustc hello.rs && ./hello` on Ferrix. The compiler is
  # the rust-lang.org release on Debian's glibc, from a btrfs volume
  # tools/common/fetch/fetch-rustc-sysroot.sh makes out of pinned downloads; the
  # downloads are cached by the script's hash, which pins them. Under KVM,
  # which the hosted runners have once /dev/kvm is opened to the user: LLVM
  # emulated instruction by instruction takes minutes where this takes
  # seconds. Then stage 20's first step on the same volume's tree: Ferrix
  # runs `cargo xtask build` on itself, and the image it made must boot.
  # ----------------------------------------------------------------
  rustc:
    name: rustc on Ferrix, and Ferrix built on Ferrix (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-none, x86_64-unknown-uefi, x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-x86_64

      - name: Install QEMU, firmware and btrfs-progs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf btrfs-progs

      # x86-64 boots need the QEMU tools/common/fetch/fetch-qemu-linux.sh
      # builds, whose intel-iommu blocks compatibility-format interrupts
      # (docs/NVIDIA.md §12.3); xtask refuses any other. Cached by the hash
      # of the script and the patches it applies.
      - name: Cache the patched QEMU
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/ferrix/qemu
          key: qemu-ferrix-cfi-${{ runner.os }}-${{ hashFiles('tools/common/fetch/fetch-qemu-linux.sh', 'tools/common/data/qemu/**') }}

      # On every run, not only when building: a cached QEMU still needs the
      # libraries it was linked against, and without them `--version` fails
      # and xtask refuses the boot.
      - name: Install the patched QEMU's libraries
        run: |
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libgtk-3-dev libepoxy-dev libgbm-dev \
            libvirglrenderer-dev libspice-protocol-dev libpulse-dev \
            libpipewire-0.3-dev libasound2-dev libzstd-dev libslirp-dev

      - name: Build the patched QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3-venv flex bison git pkg-config
          tools/common/fetch/fetch-qemu-linux.sh

      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the sysroot's downloads
        uses: actions/cache@v4
        with:
          path: ~/.local/share/ferrix/rustc/pool
          key: rustc-sysroot-${{ hashFiles('tools/common/fetch/fetch-rustc-sysroot.sh') }}

      - name: Make the rustc volume
        run: tools/common/fetch/fetch-rustc-sysroot.sh

      - name: Compile and run hello.rs on Ferrix
        run: cargo xtask test-rustc --release --accel kvm --timeout 900

      # Before the next boot writes the serial log again.
      - name: Keep hello.rs's serial log aside
        if: always()
        run: cp build/x86_64/serial.log build/x86_64/rustc-serial.log || true

      # Stage 20's first step: `cargo xtask build` run inside Ferrix, and the
      # image it made booted. Its crates are vendored from Cargo's cache, so
      # every one the lock names is fetched first.
      - name: Fetch every crate the workspace locks
        run: cargo fetch --locked

      - name: Build Ferrix on Ferrix, and boot what it built
        run: cargo xtask test-selfhost --accel kvm --timeout 1800

      - name: Keep the serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-rustc
          path: |
            build/x86_64/rustc-serial.log
            build/x86_64/selfhost/build-serial.log
            build/x86_64/serial.log
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Dependency hygiene. The budget here is near zero on purpose: this is
  # code that runs in ring 0 with nothing above it to contain a mistake.
  # ----------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # ----------------------------------------------------------------
  # Miri (UB check).
  #
  # Miri cannot interpret a kernel: there is no `asm!`, no MMIO and no
  # privileged instruction it can execute. What it can interpret is
  # `src/lib/`, and that is the argument for `src/lib/` existing. The ELF
  # reader, the page-table arithmetic and the allocators are the places a
  # provenance or aliasing mistake would actually be made, and they are
  # written as pure functions of bytes precisely so this job can reach
  # them.
  #
  # Three runners, each taking about a third of the time: in one job the
  # crates were an hour, interpretation being one thread per crate. Each
  # step names its part, balanced by the times measured on 2026-09-28;
  # `cargo xtask miri` runs the same crates side by side locally.
  # ----------------------------------------------------------------
  miri:
    name: Miri (UB check, part ${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      - name: Miri setup
        run: cargo +nightly miri setup

      - name: Miri (ELF reader)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-elf --lib

      - name: Miri (handoff ABI)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-bootinfo --lib

      # The initial process stack. Every address in the image is arithmetic on
      # a stack top, and the image is read back through a second set of index
      # calculations; Miri checks both against the buffer's real provenance
      # rather than against the crate's own idea of where the buffer ends.
      - name: Miri (process stack image)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-ustack --lib

      # The handle table. Every native system call starts by turning a number
      # a program chose into a slot index, and the table hands objects out by
      # value across `mem::replace`; Miri checks both against real provenance.
      - name: Miri (handle table and message queue)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-objects --lib

      # The VFS takes up to four inode locks for one rename and hands out
      # dentries through weak references, which is aliasing Miri can see and
      # a test that merely passes cannot.
      - name: Miri (VFS)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-vfs --lib

      # PCI configuration space. The crate forbids unsafe, so what Miri adds
      # here is narrower than for the crates above: every offset a device's
      # pointer produces is used to index the test bus's buffers, and Miri
      # checks those indices against the buffers' real extent.
      - name: Miri (PCI configuration space)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-pci --lib

      # The block core. It forbids unsafe too, so again the gain is narrower
      # than aliasing: it keeps a unit's parts in one allocation that is moved
      # between three indexes, a barrier list and the in-flight map, and hands
      # a dispatch back as a borrow of the entry it just inserted. Miri runs
      # the model-based sequences over exactly that churn.
      - name: Miri (block request queue)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-block --lib

      # The block ring. The crate forbids unsafe, so as for PCI, what Miri adds
      # is a check of every entry offset and probe index against the test
      # memory's and the id table's real extent, including the lockstep tests
      # that race the two sides' want-bell handshakes on real threads.
      - name: Miri (block ring)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-blkring --lib

      # The native call wrappers. The crate forbids unsafe too; what Miri
      # checks is the tests' kernel writing through each call's borrowed
      # output buffers by address, which is the aliasing a real trap relies on.
      - name: Miri (native call wrappers)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-native --lib

      # The virtio-blk driver. Its tests run it against a fake device over a
      # fake IOMMU, where every ring offset and device address the driver
      # computes indexes a test buffer, and the model-based test drives
      # thousands of submissions and completions through them; Miri checks
      # each index against the buffer's real extent.
      - name: Miri (virtio-blk driver)
        if: matrix.part == 2
        run: cargo +nightly miri test -p ferrix-virtio-blk --lib

      # The buddy allocator, which every page in the kernel comes from. Its
      # state is one array of entries addressed by frame number, split and
      # merged through index arithmetic on a slice the kernel lends it for its
      # whole life; Miri checks every one of those indices and borrows. The
      # long random workload runs a tenth of its host length here: at full
      # length it alone was nine minutes of interpretation.
      - name: Miri (frame allocator)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-frame --lib

      # The kernel heap. It keeps its free lists inside the free objects,
      # read and written through an unsafe trait at addresses it computes from
      # a page and a size class, so a link written one object off lands in a
      # neighbour. The tests back that trait with real buffers, and Miri checks
      # each link against the buffer it was carved from.
      - name: Miri (heap)
        if: matrix.part == 2
        run: cargo +nightly miri test -p ferrix-heap --lib

      # Fallible construction for the certified item (finding F-23). `try_box`
      # writes a value into memory the global allocator handed back and turns
      # it into a `Box` with `from_raw`, and the tests swap in a global
      # allocator that records and refuses; Miri checks the write, the layout
      # the `Box` is freed with, and the recording allocator itself.
      - name: Miri (fallible construction)
        if: matrix.part == 1
        run: cargo +nightly miri test -p ferrix-fallible --lib

      # Page-table construction for every encoding the kernel builds: the
      # three CPUs', VT-d's second level and the SMMU's stage 2. The walk
      # derives each next table's index from the descriptor it just read,
      # which is exactly the arithmetic this job's comment is about.
      - name: Miri (page tables)
        if: matrix.part == 3
        run: cargo +nightly miri test -p ferrix-paging --lib

      # The service manager's pure core. It forbids unsafe, so what Miri
      # adds is the parser's slicing of bytes a unit file chose, and the
      # borrows the loader and the manager take into the unit set.
      - name: Miri (service manager)
        if: matrix.part == 3
        run: cargo +nightly miri test -p ferrix-svc --lib

      # The password hash authd keeps credentials under. It forbids unsafe;
      # what Miri adds is the index arithmetic that picks each reference
      # block, which a wrong lane length or segment would carry out of the
      # memory it was given.
      - name: Miri (password hash)
        if: matrix.part == 2
        run: cargo +nightly miri test -p ferrix-argon2 --lib

      # seccomp's verifier and interpreter, which run a filter a process wrote
      # in ring 0. The crate forbids `unsafe`, so what Miri checks is the
      # arithmetic and the indexing of the machine, over every rule's tests.
      - name: Miri (seccomp)
        if: matrix.part == 2
        run: cargo +nightly miri test -p ferrix-seccomp --lib

  # ----------------------------------------------------------------
  # Fuzz the surfaces that parse bytes somebody else chose.
  #
  # In a kernel that set is small but it is the sharp end: an ELF header
  # comes from whatever the user just ran, and a cpio archive from an
  # initramfs assembled elsewhere. Both are parsed with the MMU on and no
  # supervisor above.
  #
  # Replay first, search second. The committed corpus in `src/tests/fuzz/corpus/` is
  # what makes this a regression test: an input that crashed once fails
  # again in seconds, rather than waiting for the fuzzer to rediscover it
  # inside a timebox.
  # ----------------------------------------------------------------
  fuzz:
    name: Fuzz (replay, then search)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: src/tests/fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # `--fuzz-dir .` on every call: cargo-fuzz finds the project's root --
      # the workspace's -- and looks for `fuzz/` under it, whatever the working
      # directory, and the corpus has been in src/tests/fuzz since the tree was
      # regrouped (2026-09-26). Without it every call read fuzz/Cargo.toml and
      # the job failed before building anything.
      # Pin the gnu host target: cargo-fuzz otherwise selects
      # x86_64-unknown-linux-musl, whose static libc is incompatible with
      # AddressSanitizer and whose std the runner does not have.
      - name: Build every target
        run: cargo +nightly fuzz build --fuzz-dir . --target x86_64-unknown-linux-gnu
        working-directory: src/tests/fuzz

      - name: Replay the committed corpus
        run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir .); do
            echo "::group::replay $target"
            cargo +nightly fuzz run --fuzz-dir . "$target" \
              --target x86_64-unknown-linux-gnu -- -runs=0
            echo "::endgroup::"
          done
        working-directory: src/tests/fuzz

      - name: Search
        # Thirty seconds each: long enough to explore what the diff changed,
        # short enough that the job stays inside a pull request's budget.
        # One target per core, since each fuzzer is one process: one after
        # the other, the targets were eighteen minutes. Each target's output
        # is kept and printed whole when it ends, and every target runs
        # whichever find something; the step fails if any did.
        run: |
          search() {
            log="$RUNNER_TEMP/search-$1.log"
            if cargo +nightly fuzz run --fuzz-dir . "$1" \
                --target x86_64-unknown-linux-gnu -- -max_total_time=30 >"$log" 2>&1; then
              echo "searched $1"
            else
              echo "::group::search $1 FAILED"; cat "$log"; echo "::endgroup::"
              echo "::error::fuzz target $1 found something"
              return 1
            fi
          }
          export -f search
          cargo +nightly fuzz list --fuzz-dir . | xargs -P "$(nproc)" -I{} bash -c 'search {}'
        working-directory: src/tests/fuzz

      - name: Keep the crashing input
        # Without this the run reports a crash and throws away the bytes that
        # caused it, which costs a whole rediscovery to reproduce.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: src/tests/fuzz/artifacts/
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # What a pull request adds to the dependency graph, against GitHub's
  # advisory database: a known-vulnerable crate or action, or a licence
  # deny.toml would refuse, fails here before a person reads the diff.
  # Pull requests only; cargo-deny covers the tree as a whole.
  # ----------------------------------------------------------------
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # ----------------------------------------------------------------
  # The one check the rulesets require of CI (docs/REPO-FLOW.md), so the
  # required list does not have to name twenty jobs and change whenever one
  # is added. It fails when any job it waits for failed or was cancelled; a
  # job skipped by its own `if` (dependency review outside pull requests)
  # counts as passed.
  #
  # ADVISORY jobs are run and shown but do not decide: "rustc on Ferrix"
  # fails most runs on the hosted runner's KVM with two kernel self-check
  # panics no other host shows (getrusage(RUSAGE_THREAD) above the wall
  # clock; the stage 9 XINUSE wake check), and while it does, a required
  # check that included it would stop every promotion. Take it out of
  # ADVISORY when both have their fix.
  # ----------------------------------------------------------------
  result:
    name: CI result
    if: always()
    needs: [authorship, assembly, audits, model, layering, check, test, ferrousli,
            build, boot, rustc, deny, miri, fuzz, dependencies]
    runs-on: ubuntu-latest
    # statuses: the dispatched run reports itself to the promotion (below).
    # A fork's pull request gets a read-only token whatever this says.
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Every job passed
        id: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          ADVISORY: rustc
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          advisory = set(os.environ["ADVISORY"].split())
          bad = {k: v["result"] for k, v in needs.items()
                 if v["result"] in ("failure", "cancelled") and k not in advisory}
          for k, v in sorted(needs.items()):
              print(f"{k:14} {v['result']}{'  (advisory)' if k in advisory else ''}")
          if bad:
              raise SystemExit(f"failed: {', '.join(sorted(bad))}")
          PY

      # A run the Promote workflow dispatches is not counted by its pull
      # request: GitHub leaves check suites of workflow_dispatch out of a pull
      # request's checks, so the ruleset never saw this job's check run on
      # the promoted commit and promotion #4 stayed BLOCKED with every job
      # green (2026-10-23). So the run also posts its verdict as a commit
      # status of the same name. The workflow's token is the GitHub Actions
      # app's, the source the rulesets require for "CI result"; only someone
      # with write access can dispatch a run.
      - name: Report the verdict to the promoted commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.verdict.outcome == 'success' && 'success' || 'failure' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f "state=$STATE" \
            -f "context=CI result" -f "description=CI run ${GITHUB_RUN_ID}: $STATE" -f "target_url=$URL"
