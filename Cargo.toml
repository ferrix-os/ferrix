[workspace]
# v3 makes the `rust-version` pin below bind, so a crate needing a newer
# compiler is skipped rather than silently attempted.
resolver = "3"
members = [
    # Architecture-neutral, host-testable logic. Everything that can be a pure
    # function of bytes lives here rather than in the kernel, because this is
    # the code `cargo test`, Miri and the fuzzers can actually reach.
    "src/lib/platform/acpi",
    "src/lib/fs/block",
    "src/lib/proto/blkring",
    "src/lib/drivers/block/blkserve",
    "src/lib/proto/devmgr-proto",
    "src/lib/proto/drvupdate-proto",
    "src/lib/init/svc-proto",
    "src/lib/proto/auth-proto",
    "src/lib/proto/displayctl",
    "src/lib/proto/renderctl",
    "src/lib/proto/inputctl",
    "src/lib/proto/sndctl",
    "src/lib/proto/chardevctl",
    "src/lib/proto/adb",
    "src/lib/proto/logctl",
    "src/lib/proto/audit",
    "src/lib/proto/bootinfo",
    "src/lib/platform/description",
    "src/lib/platform/elf",
    "src/lib/kernel/fbtext",
    "src/lib/platform/fdt",
    "src/lib/kernel/fallible",
    "src/lib/kernel/frame",
    "src/lib/kernel/heap",
    "src/lib/kernel/kmem",
    "src/lib/fs/btrfs",
    "src/lib/fs/btrfs-vfs",
    "src/lib/fs/btrfs-write",
    "src/lib/fs/cpio",
    "src/lib/fs/partition",
    "src/lib/kernel/crng",
    "src/lib/kernel/seccomp",
    "src/lib/crypto/argon2",
    "src/lib/proto/linux-abi",
    "src/lib/network/netwire",
    "src/lib/network/nettcp",
    "src/lib/network/net",
    "src/lib/proto/netring",
    "src/lib/drivers/net/netserve",
    "src/lib/network/netlink",
    "src/lib/proto/native-abi",
    "src/lib/proto/native",
    "src/lib/kernel/objects",
    "src/lib/drivers/display/stm32-display",
    "src/lib/drivers/usb/usb-host",
    "src/lib/drivers/usb/usb-device",
    "src/lib/drivers/usb/dwc3",
    "src/lib/drivers/gpu/gc400",
    "src/lib/kernel/sync",
    "src/lib/kernel/ustack",
    "src/lib/kernel/vdso",
    "src/lib/drivers/console/vdagent",
    "src/lib/drivers/virtio",
    "src/lib/drivers/block/virtio-blk",
    "src/lib/drivers/block/stm32-sdmmc",
    "src/lib/drivers/console/virtio-console",
    "src/lib/drivers/display/virtio-gpu",
    "src/lib/drivers/input/virtio-input",
    "src/lib/drivers/sound/virtio-snd",
    "src/lib/drivers/net/virtio-net",
    "src/lib/kernel/vma",
    "src/lib/kernel/paging",
    "src/lib/fs/procfs",
    "src/lib/fs/cgroupfs",
    "src/lib/fs/sysfs",
    "src/lib/init/restart",
    "src/lib/init/svc",
    "src/lib/platform/pci",
    "src/lib/kernel/qr",
    "src/lib/kernel/sched",
    "src/lib/fs/vfs",
    "src/lib/proto/pkg",

    # The UEFI loader. Firmware calls into it with a stack and the MMU on, so
    # there is no bootstrap assembly on any architecture.
    "src/boot/common/uefi",
    "src/boot/vendor/google/pixel7",

    # The kernel proper.
    "src/kernel",

    # Native user-space programs, built for the kernel's own targets and put
    # in the initramfs. Like the kernel they cannot be built or tested for the
    # host, so the host gates exclude them; everything about them that can be
    # a pure function lives in `src/lib/proto/native`.
    "src/user/system/native/rt",
    "src/user/system/native/driver",
    "src/user/system/native/channel-echo",
    "src/user/system/native/pong",
    "src/user/system/native/ipc-bench",
    "src/user/system/native/ipc-equiv",
    "src/user/system/native/drivers/block/virtio-blk",
    "src/user/system/native/drivers/block/stm32-sdmmc",
    "src/user/system/native/drivers/net/virtio-net",
    "src/user/system/native/drivers/display/virtio-gpu",
    "src/user/system/native/drivers/display/stm32-ltdc",
    "src/user/system/native/drivers/input/virtio-input",
    "src/user/system/native/drivers/sound/virtio-snd",
    "src/user/system/native/drivers/usb/usbhid",
    "src/user/system/native/drivers/usb/usbdev",
    "src/user/system/native/drivers/gpu/gc400",
    "src/user/system/native/drivers/console/vport",
    "src/user/system/native/devmgr",
    "src/user/system/native/drvupdated",

    # Host-side build and test driver (`cargo xtask ...`).
    "tools/common/xtask",
]
# So a bare `cargo build` builds the host tool rather than trying to compile
# freestanding crates for the host target.
default-members = ["tools/common/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches rust-toolchain.toml: the version the resolver holds dependencies to.
rust-version = "1.97"
license = "MIT"
publish = false

