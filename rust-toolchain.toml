[toolchain]
# Pinned exactly rather than "stable": a floating channel means a compiler
# upgrade lands as a red CI run on somebody's unrelated pull request. Bumping
# this is its own commit.
#
# Kept in step with `rust-version` in Cargo.toml, which is what the v3 resolver
# holds dependencies to.
channel = "1.99.1"
components = ["rustfmt", "clippy", "llvm-tools", "rust-src"]
targets = [
    # The kernels: freestanding, no red zone, soft float, and on x86-64 the
    # kernel code model.
    "x86_64-unknown-none",
    "aarch64-unknown-none-softfloat",
    "armv7a-none-eabi",
    # The loaders: firmware calls them with the MMU on and a stack set up,
    # which is why this project has no bootstrap assembly on any architecture.
    "x86_64-unknown-uefi",
    "aarch64-unknown-uefi",
    # The ARMv7-A loader, for which rustc has no UEFI target. It is linked as a
    # static PIE and converted to PE32 by `tools/common/xtask/src/pe.rs`, and it is built
    # for this target rather than `armv7a-none-eabi` because this one's `core`
    # is compiled position-independent; see docs/arm32.md, decision 2. No libc
    # and no C runtime is linked: `.cargo/config.toml` says so.
    "armv7-unknown-linux-musleabi",
    # ferrousli, the C library, when it is built on a host that is not Linux:
    # `src/user/system/linux/ferrousli/tools/busybox/build-windows.sh` cross-builds it on Windows.
    "x86_64-unknown-linux-gnu",
    # zinc, the zsh-compatible shell in `src/user/system/linux/zinc/`: a static std program for the
    # initramfs, linked by rust-lld against the target's own musl.
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    # `test-threads --i686`: the thread program as a 32-bit x86 program, which
    # the x86-64 kernel runs in compatibility mode (`docs/I386.md`, I4).
    "i686-unknown-linux-musl",
    # ferrousli on AArch64 and ARMv7-A, hard-float as Debian's armhf is, whose
    # programs it must one day load in glibc's place. Its unit tests link
    # `std`, which needs a C library under it, so they build for the gnu
    # targets and run under qemu-user, as its C tests do.
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    # And its loader on ARMv7-A: a static PIE with no C library, which this
    # musl target links (AArch64's is the musl target above).
    # And the compositor's programs on ARMv7-A (`src/user/system/linux/compositor/.cargo/config.toml`):
    # hard float, since a compositor blends pixels in floating point and soft
    # float would make every one of those operations a library call.
    "armv7-unknown-linux-musleabihf",
]
