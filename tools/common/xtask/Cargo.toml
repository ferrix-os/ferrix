[package]
name = "xtask"
description = "Host-side build, image and QEMU driver for Ferrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Nothing from crates.io, deliberately. This is the program that builds the
# operating system, and a build tool that cannot be built is a bad day; the
# FAT32 writer and the argument parser it would otherwise pull in are a few
# hundred lines each.
#
# The one dependency is the tree's own ELF reader, for the ARMv7-A loader's
# conversion to PE32. It is already fuzzed and host-tested, and the alternative
# was a second ELF reader here that nothing fuzzes.
ferrix-elf.workspace = true
# The tree's own header formats, for the host-side network gateway in
# `gateway/`. The alternative was a second Ethernet, ARP, IPv4, ICMP, UDP and
# TCP parser in the build tool, disagreeing with the kernel's about a length
# field at the worst possible moment; this one is already fuzzed.
ferrix-netwire.workspace = true
# The kernel's own cpio reader: `flash` reads the archive `initramfs.rs` wrote
# to strip the card's copy of its programs, and the tests read every archive
# with the code that will unpack it rather than with a second opinion.
ferrix-cpio.workspace = true
# adb's message format, for `test-adb`'s check that a forward reaches the
# guest: it speaks one CNXN through it with the bytes adbd itself decodes.
ferrix-adb.workspace = true
# vdagent's framing and messages, for `test-clipboard`'s host half: it speaks
# the protocol to the guest's agent with the bytes the agent itself decodes.
ferrix-vdagent.workspace = true
# The display protocol's EDID reader and checker: `edid.rs` finds this
# machine's monitor by what its EDID says, and checks the bytes it carries into
# an image the way the kernel will check them when `drm.edid_firmware` names
# the file. A second reader here would be a second opinion on which file the
# kernel accepts.
ferrix-displayctl.workspace = true
# The password hash authd stores credentials under: an image's seed
# (`--auth-seed`, and the gate's) is hashed on the host by the same code
# that checks it on the guest, so the two cannot disagree about a hash.
ferrix-argon2.workspace = true
# Packages (`docs/APPS.md` §6): an app's manifest, the record its package
# carries, and the plan that installs a set. The package manager on Ferrix
# will be the same code, so the images this builds and the installs it will
# make cannot disagree about what a package is.
ferrix-pkg.workspace = true
# GUID partition tables: `live` lays the live medium out with the writer
# `ferrix-install` partitions a target with and the kernel's reader checks,
# so the medium, the installer and the kernel cannot disagree about a table.
ferrix-partition.workspace = true

[dev-dependencies]
# The native ABI's numbers, which a host test holds nvrm's C header to
# (`nvrm/tests.rs`): nvrm names the calls it makes by number, in C.
ferrix-native-abi.workspace = true

[lints]
workspace = true
