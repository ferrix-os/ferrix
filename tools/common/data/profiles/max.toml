# `max`: the microkernel at the top level (docs/BUILD-FLAGS.md §1): IEC
# 61508-3 SC 4 / ISO 26262 ASIL D, carried from M7. Its true values from M0
# (BF8). It builds on AArch64 at level none since its flip of 2026-11-26
# (ledger 10916, 10927), held to sc4; x86-64 refuses it by `built_on`, naming
# schedule=windows and kernel_memory=retyped (docs/microkernel/FLIP.md).
#
# ipc_fastpath is `off` until one coverage run has measured the fast path and
# its vulnerability-analysis entry exists (the customer's rule of 2026-10-02,
# binding max alone); then it becomes `on` as a dated change to this file.
# restricted_fastpath is `off` until K1's review decides it.
#
# kernel_memory=retyped needs a machine of at least 640 MiB on x86_64 and on AArch64 under this
# profile's values (fs=server), and 480 MiB (x86_64) or 464 MiB (AArch64) without fs=server: the
# smallest QEMU machine on which linuxd's arena clears the line the kernel computes at boot from the
# root it is given, for this image, at the hash and rows docs/microkernel/K16.md §4.1 names. A smaller
# machine is refused by name before linuxd runs (FX-0955, "the machine is too small for
# kernel_memory=retyped"). Not a board figure: the target's is M7's (ledger 7017 R.5, 10379, 10468).
# These were found on debug images. A release image is refused by name at 640 MiB under fs=server
# (tag n27c-k9-s2-rel-dev, develop 2d96e34fe). Release boots at 768 MiB on AArch64; its minimum
# not found (ledger 10916 R5; the finding moved to before M5's flip, BACKLOG).

profile = "max"
# No claim until M7, which writes `level = "sc4"` and takes `target_level` out, and rule 3
# then applies in full; until then its values are held to the target (ledger 7011 LV.1).
level = "none"
target_level = "sc4"
claim = "IEC 61508-3 SC 4 / ISO 26262 ASIL D, from M7"
claim_architectures = ["aarch64"]
# The QEMU processor model its rows boot on, per architecture (ledger 10312 J3, 10522 (D) 1):
# `max` stops by name on a processor that neither issues the exit barrier nor shows itself
# unaffected, and QEMU's default Cortex-A72 has no CSV2 and no firmware workaround, where
# its Neoverse N1 reads CSV2. The model shows the decision's path, not any hardware's
# immunity (M7's, on the target). Other profiles boot on xtask's default.
qemu_cpu = { aarch64 = "neoverse-n1" }
buildable_from = "M5"
image = { driver_updates = "absent", settings_writer = "absent", slot_signing = "off", bad_frames = "persist" }
# The families its loader accepts a slot manifest for (docs/SIGNING.md §1.4, §10.6).
slot_families = []
exceptions = []

[flags]
personality = "user"
fs = "server"
mitigations = "on"
partition_speculation = "exit"
ipc_fastpath = "off"
restricted_fastpath = "off"
fault_ahead = "off"
restricted_window = "off"
kernel_memory = "retyped"
schedule = "windows"
checks = "on"
program_barrier = "switch"
ssbd = "always"
smt = "off"
runtime_trades = "none"
linux_abi = "on"
runtime_settings = "fixed"
board_glue = "on"

[boot_options]
"ferrix.checks" = ["run"]
"ferrix.root" = ["*"]
"ferrix.init" = ["*"]
"ferrix.onexit" = ["*"]
"ferrix.panic" = ["halt"]
"ferrix.vtd" = ["on"]
"ferrix.amdvi" = ["on"]
console = ["*"]

# The build settings that change code without a cfg (BF4), compared with the
# tree by check-item-boundary.py: the toolchain with rust-toolchain.toml, the
# codegen with Cargo.toml's [profile.release], the rustflags with
# .cargo/config.toml, and the link arguments with src/kernel/build.rs.
[build]
cargo_profile = "release"
toolchain = "1.99.1"
codegen = { opt-level = 2, lto = true, codegen-units = 1, panic = "abort" }

[build.rustflags]
x86_64 = ["-C", "link-arg=-zmax-page-size=4096", "-C", "relocation-model=pie", "-C", "link-arg=-no-pie", "-C", "force-frame-pointers=yes"]
aarch64 = ["-C", "link-arg=-zmax-page-size=4096", "-C", "relocation-model=static", "-C", "force-frame-pointers=yes"]
armv7a = ["-C", "link-arg=-zmax-page-size=4096", "-C", "relocation-model=static", "-C", "force-frame-pointers=yes"]

[build.link]
x86_64 = { mode = "static PIE, PIC code model", args = ["-pie", "--no-dynamic-linker"] }
aarch64 = { mode = "static PIE", args = ["-pie", "--no-dynamic-linker", "-znotext"] }
armv7a = { mode = "fixed address with relocations", args = ["--emit-relocs"] }
