# Ferrix's build flags: what a kernel image contains, chosen at compile time.
#
# docs/BUILD-FLAGS.md is the design and its rules; this file is the one place
# the flags, their values, the levels and the boot options are declared.
# Read by:
#
#   * xtask's resolver (tools/common/xtask/src/flags.rs), which turns a
#     profile and any `--set` into the kernel's `--cfg ferrix_<flag>="<value>"`
#     set and the `--check-cfg` list that declares every flag and value;
#   * tools/common/check/check-item-boundary.py, which holds the profile rule
#     (BUILD-FLAGS.md rule 3) and this file's own consistency;
#   * tools/common/check/check-boot-line.py, the gate, which compares a
#     kernel's `build` boot line with its profile file (rule 6) -- never with
#     anything xtask printed.
#
# Nothing here is a Cargo feature, and nothing here is a boot option: rule 1.

# ---------------------------------------------------------------------------
# The standards, each as an ordered scale, lowest first. A level (below) names
# one target per standard it covers; "allows" compares standard by standard
# (BUILD-FLAGS.md §4, BF10): a level A covers a level B only if, for every
# standard in B's set, A names a target at least as high on that standard's
# scale. So `sc4` covers `present` and `sc2`, while `present` and `sc2` are
# incomparable, which the gate tests.

[standards.iec61508_3]
name = "IEC 61508-3 systematic capability"
scale = ["SC 1", "SC 2", "SC 3", "SC 4"]

[standards.iso26262]
name = "ISO 26262 ASIL"
scale = ["ASIL A", "ASIL B", "ASIL C", "ASIL D"]

[standards.en50716]
name = "EN 50716 SIL"
scale = ["SIL 1", "SIL 2", "SIL 3", "SIL 4"]

[standards.do178c]
name = "DO-178C design assurance level"
scale = ["DAL E", "DAL D", "DAL C", "DAL B", "DAL A"]

[standards.iec62304]
name = "IEC 62304 software safety class"
scale = ["Class A", "Class B", "Class C"]

[standards.common_criteria]
name = "Common Criteria evaluation assurance level (the TOE)"
scale = ["EAL4+", "EAL5", "EAL5+", "EAL6", "EAL6+", "EAL7"]

# ---------------------------------------------------------------------------
# The levels, each defined once as its full set of targets (BF2). The names
# are labels only. `sc2`'s Common Criteria target is what `fast`'s Security
# Target will say, and is not fixed yet, so it names none.

[levels.none]
targets = {}
why = "no claim: `desktop`, and every ad-hoc build"

[levels.present]
targets = { iec61508_3 = "SC 2", en50716 = "SIL 2", do178c = "DAL C", iec62304 = "Class C", common_criteria = "EAL5+" }
why = "interim: today's item and its four targets (the customer, ledger 869), until M5's flip"

[levels.sc2]
targets = { iec61508_3 = "SC 2", iso26262 = "ASIL B", en50716 = "SIL 2", iec62304 = "Class C" }
why = "`fast`: IEC 61508-3 SC 2 / ISO 26262 ASIL B; its Common Criteria target as fast's ST says"

[levels.sc4]
targets = { iec61508_3 = "SC 4", iso26262 = "ASIL D", en50716 = "SIL 4", do178c = "DAL A", iec62304 = "Class C", common_criteria = "EAL6+" }
why = "`max`: IEC 61508-3 SC 4 / ISO 26262 ASIL D (MICROKERNEL.md §6.5); DAL A's objectives"

# ---------------------------------------------------------------------------
# The flags, in the order the kernel's `build` boot line names them. Each
# value says:
#
#   allows  the levels it allows, explicitly (DF1); `all` is never written;
#   lands   where its code is or will be: `today` for what the tree had
#           before M0, else the stage that builds it (MICROKERNEL.md §8);
#   built   `yes`: its code is in the tree and the value builds;
#           `stand-in`: it builds today's code of the value it names in
#           `stands_in`, which is the stricter one, and is allowed only in a
#           profile at level `none` or an ad-hoc build, so no certified image
#           ever carries one; its kernel still names the value it was built
#           with, which overstates what it relaxes and never understates it;
#           `no`: xtask refuses to build it, naming `lands`;
#   requires / conflicts  other flags' values, as `flag=value`.
#
# A value's code is selected only in the kernel crate, by
# `cfg(ferrix_<flag> = "<value>")` (rule 6 b).

[flags.personality]
why = "where the Linux ABI runs: as linuxd in user space, built into ring 0 through the shim (MICROKERNEL.md §4), or nowhere, with linux_abi=off (LINUX-ABI-SEPARATION.md §11.7: the Linux ABI's placement flag)"
values.user = { allows = ["sc4", "present", "sc2", "none"], lands = "M5", built = "no" }
values.kernel = { allows = ["none"], lands = "today", built = "yes" }
values.none = { allows = ["none"], lands = "LINUX-ABI-SEPARATION.md §11.11", built = "yes", requires = ["linux_abi=off"] }

[flags.fs]
why = "btrfs as btrfsd, the btrfs crates in ring 0 with today's glue, or no filesystem in a kernel without the Linux ABI, whose VFS it is"
values.server = { allows = ["sc4", "present", "sc2", "none"], lands = "M5", built = "no" }
values.kernel = { allows = ["none"], lands = "today", built = "yes", requires = ["personality=kernel"] }
values.none = { allows = ["none"], lands = "LINUX-ABI-SEPARATION.md §11.11", built = "yes", requires = ["personality=none"] }

[flags.mitigations]
why = "F-31's speculation defences and KASLR (docs/certification/SPECULATION.md); Zenbleed's and GDS's fixes leave it with DF6"
values.on = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes" }
values.off = { allows = ["none"], lands = "M0", built = "yes" }

[flags.partition_speculation]
why = "the barriers at a restricted exit (`exit`) or only at partition switches (`partition`); not applicable to a hybrid kernel"
values.exit = { allows = ["sc4", "present", "sc2", "none"], lands = "M3", built = "no", requires = ["personality=user"] }
values.partition = { allows = ["sc2", "none"], lands = "M3", built = "no", requires = ["personality=user"] }
values.not_applicable = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes", conflicts = ["personality=user"] }

[flags.ipc_fastpath]
why = "the fast path for channel_write_read (0x1013); `on` allows sc4 and present only once the 2026-10-02 rule is met, recorded as a dated change here"
values.off = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes" }
values.on = { allows = ["sc2", "none"], lands = "M0", built = "stand-in", stands_in = "off" }

[flags.restricted_fastpath]
why = "K1's fast path for the restricted exit and re-entry; its levels are K1's review's to set, and until then `on` allows no certified level above sc2"
values.off = { allows = ["sc4", "present", "sc2", "none"], lands = "M3", built = "no", requires = ["personality=user"] }
values.on = { allows = ["sc2", "none"], lands = "M3", built = "no", requires = ["personality=user"] }
values.not_applicable = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes", conflicts = ["personality=user"] }

[flags.kernel_memory]
why = "K16's memory retyped from the job's own reservation, or today's fallible, charged shared heap"
values.retyped = { allows = ["sc4", "present", "sc2", "none"], lands = "M6", built = "no" }
values.heap = { allows = ["present", "sc2", "none"], lands = "today", built = "yes" }

[flags.schedule]
why = "K9's static windows with EDF inside them, stage 14's HardRt (partitioned EDF with CBS), or today's fair scheduler"
values.windows = { allows = ["sc4", "present", "sc2", "none"], lands = "M3", built = "no" }
values.edf = { allows = ["present", "sc2", "none"], lands = "M3", built = "no" }
values.fair = { allows = ["present", "none"], lands = "today", built = "yes" }

[flags.checks]
why = "the in-kernel boot checks compiled in; with `on`, ferrix.checks still chooses whether they run. `off` is for ad-hoc builds alone, built by xtask check on every architecture (BF7)"
values.on = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes" }
values.off = { allows = ["none"], lands = "M0", built = "yes" }

[flags.program_barrier]
why = "the barrier at every switch between programs not in one marked domain (`switch`), or between login sessions' domains only (`session`, BUILD-FLAGS.md §3.1)"
values.switch = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes" }
values.session = { allows = ["none"], lands = "M0", built = "stand-in", stands_in = "switch" }

[flags.ssbd]
why = "Speculative Store Bypass Disable for every program, or per thread for programs that ask (BUILD-FLAGS.md §3.1)"
values.always = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes" }
values.on_request = { allows = ["none"], lands = "M0", built = "stand-in", stands_in = "always" }

[flags.smt]
why = "one hardware thread per core, parked by the kernel (`off`), or sibling threads running under STIBP or eIBRS/AutoIBRS (`stibp`)"
values.off = { allows = ["sc4", "present", "sc2", "none"], lands = "M0", built = "no" }
values.stibp = { allows = ["present", "sc2", "none"], lands = "today", built = "yes" }

[flags.runtime_trades]
why = "whether the image contains game mode's privileged, per-application run-time trades; with `none` their code is absent"
values.none = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes" }
values.game_mode = { allows = ["none"], lands = "game mode's design", built = "stand-in", stands_in = "none" }

[flags.linux_abi]
why = "whether the kernel offers the Linux ABI beside its native ABI (LINUX-ABI-SEPARATION.md §11.6-11.8); its levels are its placement's, `personality`. `off` is build-only today: it type-checks on every architecture and carries no claim, and boots nothing useful until §7's rows land (§11.11); it, personality=none and fs=none allow `none` alone until a profile carries them with its own evidence (ledger 3257 (1), 3208 (6)(g)), since the board glue stays in ring 0 with them"
values.on = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes" }
values.off = { allows = ["none"], lands = "LINUX-ABI-SEPARATION.md §11.11", built = "yes", requires = ["personality=none"] }

[flags.runtime_settings]
why = "whether the kernel contains the entries by which a program changes a system setting at run time (KERNEL-CRATES.md §6.2): `fixed` leaves the removable crate ferrix-kernel-settings out of the binary and each entry answers EPERM at its dispatch; `live` links it (ledger 3558 (5), (9)-(11); 3623)"
values.fixed = { allows = ["sc4", "present", "sc2", "none"], lands = "today", built = "yes" }
values.live = { allows = ["present", "none"], lands = "today", built = "yes" }

# ---------------------------------------------------------------------------
# The image keys: image content, not kernel code, which every profile names in
# its `image` table (BUILD-FLAGS.md §3.1, "Not flags"). Each value allows
# levels as a flag's does, and may require flag values of the build.
# check-build-flags.py holds every profile to them (ledger 3623 (R17)).

[image_keys.driver_updates]
why = "whether the image carries drvupdated (DEVMGR.md §4.1)"
values.absent = { allows = ["sc4", "present", "sc2", "none"] }
values.test = { allows = ["none"] }

[image_keys.slot_signing]
why = "whether the UEFI loader starts unsigned slots: `off` boots header version 1 and the ESP's unsigned files, and verifies every version-2 slot; `required` starts only a version-2 slot whose manifest verifies, and reads only FERRIX/RESCUE.SLT as the rescue path (docs/SIGNING.md §10.6; ledger 4016)"
values.off = { allows = ["sc4", "present", "sc2", "none"] }
values.required = { allows = ["sc4", "present", "sc2", "none"] }

[image_keys.settings_writer]
why = "whether the image carries settingsd, settingsctl, the settings.* authd policies and lode reload's writer (SETTINGS-WRITER.md; ledger 3558 (6), (13), 3595 (C3))"
values.absent = { allows = ["sc4", "present", "sc2", "none"] }
values.present = { allows = ["present", "none"], requires = ["runtime_settings=live"] }

# ---------------------------------------------------------------------------
# The boot options that stay boot options (BF4): the registry. A read of any
# option not declared here fails the gate (check-item-boundary.py, with a
# planted reader as its negative control). `values` lists what the kernel
# understands, `*` for any one word; a `kind = "flag"` option is a bare word.
# Each profile file names, of these, the values it permits. `until` is the
# stage an option retires at, if it does.

[boot_options."ferrix.checks"]
values = ["run", "skip"]
why = "whether the boot checks run; a certified profile permits only `run`"

[boot_options."ferrix.root"]
values = ["*"]
why = "the root filesystem: a disk, or tmpfs"

[boot_options."ferrix.init"]
values = ["*"]
why = "the program pid 1 runs"

[boot_options."ferrix.onexit"]
values = ["*"]
why = "what the machine does when init exits"

[boot_options."ferrix.fbcon"]
kind = "flag"
why = "the framebuffer console"

[boot_options."ferrix.fbcon.small"]
kind = "flag"
why = "single-size glyphs on the framebuffer console whatever the screen's width (console/screen.rs, L.console.37)"

[boot_options."log_buf_len"]
values = ["*"]
why = "Linux's: the kernel log's size, a memparse size (decimal or 0x hex, K/M/G) rounded up to a power of two, from 128 KiB up to 4 MiB; the log and its lines are grown to it at boot with what was logged before (console/log.rs, size_from); smaller or none keeps 128 KiB, a size that is none is said and ignored"

[boot_options."ferrix.pstore"]
values = ["on", "off"]
why = "whether the loader keeps the kernel log across a reset (docs/POSTMORTEM.md §3; read by the loader through ferrix_bootinfo::pstore::switch); any other value is said and taken as off"

[boot_options."ferrix.efifb"]
kind = "flag"
why = "lend the firmware framebuffer to a ring-3 driver on x86-64 (discovery/firmware.rs, docs/DISPLAY.md §8); never in a configuration a claim is made of (SAFETY-MANUAL AoU-31)"

[boot_options."ferrix.intelgpu"]
kind = "flag"
why = "let the Intel integrated GPU at 00:02.0 be driven (device.rs, L.device.44; docs/INTEL-GPU.md §4.4 (b)): off by default; without its unit translating no client node is published for it (L.object.192) and its driver is trusted with all of memory (VULNERABILITY-ANALYSIS V-03); never in a configuration a claim is made of"

[boot_options."ferrix.apic"]
values = ["x2apic", "xapic"]
why = "x86-64: the local APICs' mode where firmware neither locked nor left x2APIC on (arch/x86_64/apic.rs, L.x86_64.131)"

[boot_options."ferrix.epp"]
values = ["performance", "balance_performance", "balance_power", "power", "*"]
why = "x86-64 only, ignored on aarch64 and armv7a: the energy and performance preference every processor's IA32_HWP_REQUEST asks for (arch/x86_64/cpu.rs, L.x86_64.182): one of four names, performance 0x00, balance_performance 0x80, balance_power 0xc0 and power 0xff, or a decimal 0 to 255 of one to three digits; no option, and anything else, which the cpu line says, is performance (0). The processor's own clock choice within the firmware's power and thermal limits, which no register Ferrix writes changes; a certified profile permits the four names"

[boot_options."ferrix.msrlog"]
kind = "flag"
why = "x86-64 only, ignored on aarch64 and armv7a: a read-only log of the RAPL power-limit (PL1/PL2/PL4, Psys), limit-reason, perf-status and thermal MSRs on the boot processor, `msr:` lines, for the N150's GT held under pl4 (arch/x86_64/msrlog.rs, L.x86_64.187); each read #GP-checked (L.x86_64.188), no register written; a diagnostic, never in a configuration a claim is made of"

[boot_options."ferrix.msrlog.period"]
values = ["*"]
why = "seconds between ferrix.msrlog's reads, 0 to 3600, 0 for once; 5 without it or for a value not understood, which the log says (L.x86_64.187)"

[boot_options."ferrix.mce.poll"]
values = ["*"]
why = "x86-64 only, ignored on aarch64 and armv7a: seconds between each processor's poll of its machine-check banks, 1 to 3600 by ferrix.msrlog's chooser; 5 without it, or for 0 or a value not understood, which the log says (arch/x86_64/mce.rs, docs/MACHINE-CHECK.md, L.x86_64.223)"

[boot_options."ferrix.mce.recover"]
values = ["off"]
why = "x86-64 only, ignored on aarch64 and armv7a: off makes every machine check stop as FX-9005, as before recovery existed; without it a machine check H.FAIL.8 names is logged and recovered from (arch/x86_64/mce.rs, L.x86_64.231, SAFETY-MANUAL AoU-36); any other value is ignored"

[boot_options."ferrix.mce.cmci"]
values = ["off"]
why = "x86-64 Intel only, ignored on aarch64 and armv7a: off claims no machine-check bank for CMCI and leaves every LVT CMCI entry masked, the poll alone as before CMCI; without it a processor reporting MCG_CMCI_P claims its banks and a corrected or no-action record wakes its poll at once; any other value is said and leaves CMCI on (arch/x86_64/mce/cmci.rs, docs/MACHINE-CHECK-CMCI.md §3.6, L.x86_64.252)"

[boot_options."ferrix.mce.cmci-window"]
values = ["*"]
test_only = true
why = "seconds (1 to 60) the first CMCI-driven poll round holds its masked window open before its unmask, so cargo xtask test-mce-cmci-window can make a record that only the look after the unmask finds (L.x86_64.253); read only in builds with the checks on, a product build has no option, and a certified profile's command line may not carry it (arch/x86_64/mce/cmci.rs, docs/MACHINE-CHECK-CMCI.md §3.4)"

[boot_options."ferrix.powerctl"]
kind = "flag"
why = "x86-64 Alder Lake-N only (Intel family 6 model 0xBE, the N150, one package), ignored on aarch64 and armv7a: publishes the power node, whose driver may set a hardware current limit, MSR_VR_CURRENT_CONFIG bits 12:0, through typed calls the kernel bounds by its model table (firmware's own limit up to 48 A, at most 23 A above firmware's), with firmware's value restored when the holder goes, its lease lapses, its backstop trips at 90 C or a thermal/PROCHOT/critical bit, a write does not read back, and on power-off, reset and panic (arch/x86_64/powerctl.rs, docs/POWERCTL.md, L.x86_64.194-209, L.device.51-53); never in a configuration a claim is made of"

[boot_options."ferrix.powerctl.fake"]
kind = "flag"
test_only = true
why = "the power node over a fake register file on any x86-64 processor, reaching no MSR, every kernel line marked (fake): cargo xtask test-power's lease and holder-death rows (L.x86_64.207); test-only, never in a certified profile"

[boot_options."ferrix.scrub"]
values = ["test"]
test_only = true
why = "test turns the RAM scrubber's stand-down off where a hypervisor is positively seen (x86-64's hypervisor bit, AArch64's hvc conduit or /hypervisor node), so cargo xtask test-scrub can sweep a QEMU guest whose type 16 says ECC; compiled into every build with the checks on, certified profiles included, so it is never honoured on bare metal and a certified profile's command line may not carry it (mm/scrub.rs, docs/RAM-SCRUBBER.md §3.3, ledger 5057 (2), 5140 (1), L.mm.106, SAFETY-MANUAL AoU-38)"

[boot_options."ferrix.panic"]
values = ["halt", "reset"]
why = "what a panic does after its report (panic/reset.rs, H.FAIL.5): halt, the reference; reset, a stop-gap for the N150 box set by no loader, outside the reference configuration (SAFETY-MANUAL AoU-32, certification-item.json `panic`)"

[boot_options."ferrix.vtd"]
values = ["on", "off"]
why = "whether the kernel drives the VT-d units it accepts (iommu.rs, L.iommu.71): on, the reference and the default; off leaves every unit alone, no DMA translated and no interrupt remapped, outside the reference configuration, for recovery only (SAFETY-MANUAL AoU-8, certification-item.json `vtd`)"

[boot_options."ferrix.amdvi"]
values = ["on", "off"]
why = "whether the kernel drives the AMD-Vi units the IVRS describes (iommu/ivrs.rs, L.iommu.98): on, the reference and the default; off leaves every unit alone, no DMA translated and no interrupt remapped, outside the reference configuration, for recovery only, as ferrix.vtd=off is for VT-d (SAFETY-MANUAL AoU-8, docs/AMD-VI.md O1)"

[boot_options."ferrix.unisolated"]
kind = "flag"
claimless = true
why = "let devmgr start drivers of devices whose DMA is not translated or whose interrupts are not isolated (discovery/devmgr.rs, L.device.58; docs/DMA-GATE.md): the kernel says it at stage 10, records it in the audit configuration (Config::Unisolated) and forwards it in DEVICES' flags; devmgr then starts each such device with an UNISOLATED line (L.device.59). Off by default. `claimless`: a certified profile that permits it fails the profile rule, so a claimed image is one booted without it (SAFETY-MANUAL AoU-8); every ARMv7-A image carries it, ARMv7-A being outside the claim until an SMMU is driven (the customer's G4, ledger 3906)"

[boot_options."ferrix.btrfs"]
values = ["*"]
test_only = true
why = "the btrfs power-fail check's mode (test-only)"

[boot_options."ferrix.btrfs.seed"]
values = ["*"]
test_only = true
why = "the btrfs power-fail check's seed (test-only); never in a certified profile"

[boot_options.console]
values = ["*"]
why = "the console port on AArch64 and ARMv7-A (arch/*/console.rs)"

[boot_options."drm.edid_firmware"]
values = ["*"]
why = "EDID files for a display's connectors (interfaces/display/edid.rs)"

[boot_options.nokaslr]
kind = "flag"
why = "keep the kernel where it was linked; read by the loaders"

[boot_options.nosmp]
kind = "flag"
why = "start the boot processor alone, for a new board's bring-up"

[boot_options.noactlr]
kind = "flag"
why = "ARMv7-A: do not read ACTLR (arch/armv7a/smp.rs), for a board whose firmware traps it; read today and not in BF4's list"

[boot_options."ferrix.devmgr"]
values = ["kernel", "init"]
until = "M5"
why = "who starts devmgr (docs/INIT.md §7.3); retires with DEVMGR_START at M5"

[boot_options."ferrix.fastpath"]
values = ["on", "off"]
until = "M0"
why = "the channel_write_read fast path (L.x86_64.159), until the ipc_fastpath flag replaces it (BF6)"

# A call that reads an option through a name the check cannot see as a
# literal: the file, and the local function every read goes through there.
[boot_option_forwarders]
"src/kernel/src/arch/armv7a/smp.rs" = "flag"
